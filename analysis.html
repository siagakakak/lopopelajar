<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lopo Pelajar - Analisis Descriptive Text HOTS</title>
  <style>
    :root { --primary: #1b365d; --secondary: #0066cc; --accent: #d97706; --danger: #dc2626; --success: #16a34a; --bg: #f8fafc; --card-bg: #ffffff; --text: #1e293b; }
    body { font-family: 'Segoe UI', System-UI, sans-serif; line-height: 1.6; color: var(--text); background-color: var(--bg); margin: 0; padding: 0; }
    .header-banner { background-color: var(--primary); color: white; padding: 20px; text-align: center; }
    .container { max-width: 900px; margin: 20px auto; padding: 0 20px; }
    .card { background: var(--card-bg); padding: 20px; margin-bottom: 15px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); border: 1px solid #e2e8f0; }
    
    /* Accordion Styles */
    .accordion-item { border: 1px solid #e2e8f0; border-radius: 8px; margin-bottom: 10px; overflow: hidden; }
    .accordion-header { background: #f1f5f9; padding: 15px 20px; cursor: pointer; font-weight: 600; display: flex; justify-content: space-between; align-items: center; transition: background 0.2s; }
    .accordion-header:hover { background: #e2e8f0; }
    .accordion-header.active { background: var(--secondary); color: white; }
    .accordion-content { display: none; padding: 20px; background: white; border-top: 1px solid #e2e8f0; }
    .accordion-content.show { display: block; }
    
    /* Form & Recorder Elements */
    textarea { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; min-height: 100px; font-family: inherit; margin-bottom: 10px; box-sizing: border-box; }
    .btn { padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; color: white; transition: 0.2s; display: inline-flex; align-items: center; gap: 8px; }
    .btn-primary { background-color: var(--secondary); }
    .btn-success { background-color: var(--success); }
    .btn-danger { background-color: var(--danger); }
    .btn:disabled { background-color: #cbd5e1; cursor: not-allowed; }
    
    .recorder-box { background: #fff7ed; padding: 20px; border-radius: 8px; border: 1px solid #fdba74; margin-top: 15px; }
    .btn-record { background: var(--danger); color: white; border: none; padding: 12px 24px; border-radius: 50px; font-size: 1rem; font-weight: bold; cursor: pointer; display: inline-flex; align-items: center; gap: 10px; box-shadow: 0 4px 12px rgba(220,38,38,0.3); }
    .btn-record.recording { background: #991b1b; animation: pulseRec 1s infinite; }
    @keyframes pulseRec { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
    
    .live-transcript-box { background: #f0f9ff; border-left: 4px solid var(--secondary); padding: 12px 16px; margin-top: 15px; border-radius: 4px; min-height: 50px; font-size: 0.95rem; color: #0c4a6e; line-height: 1.6; display: none; }
    .recorder-status { font-size: 0.9rem; margin-top: 10px; color: #7c2d12; font-weight: 600; text-align: center; }
    .recorder-status.recording { color: var(--danger); }
    
    .feedback-box { background: #f0fdf4; border-left: 4px solid var(--success); padding: 15px; border-radius: 8px; margin-top: 15px; display: none; }
    .pronounce-block { background-color: #f0f9ff; border-left: 4px solid var(--secondary); padding: 12px; color: #0369a1; font-style: italic; border-radius: 4px; margin: 10px 0; }
    .materi-box { background-color: #eff6ff; border: 2px solid var(--secondary); padding: 20px; border-radius: 12px; margin-bottom: 20px; }
    
    /* MCMA & TF Styles */
    .option-group { margin: 10px 0; padding: 10px; border: 1px solid #e2e8f0; border-radius: 8px; cursor: pointer; transition: 0.2s; }
    .option-group:hover { background: #f8fafc; border-color: var(--secondary); }
    .option-group input { margin-right: 10px; transform: scale(1.2); }
  </style>
</head>
<body>

<div class="header-banner">
  <h1>Interactive English Learning Platform</h1>
  <h2 id="sheetTitleDisplay">Descriptive Text Analysis (HOTS)</h2>
  <p id="userDisplay" style="font-size: 0.9rem; opacity: 0.9;"></p>
</div>

<div id="login-container" class="container">
  <div class="card" style="max-width: 400px; margin: 40px auto;">
    <h2 style="text-align: center; color: var(--primary);">Masuk Portal Siswa</h2>
    <input type="text" id="inputNama" placeholder="Nama Lengkap" style="width: 100%; padding: 12px; margin-bottom: 10px; border: 1px solid #cbd5e1; border-radius: 8px; box-sizing: border-box;">
    <input type="password" id="inputPass" placeholder="Password" style="width: 100%; padding: 12px; margin-bottom: 10px; border: 1px solid #cbd5e1; border-radius: 8px; box-sizing: border-box;">
    <input type="text" id="inputKelas" placeholder="Kelas (Contoh: 7A)" style="width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #cbd5e1; border-radius: 8px; box-sizing: border-box;">
    <button class="btn btn-primary" style="width: 100%; justify-content: center;" onclick="executeLogin()">Enter / Masuk</button>
    <p id="loginError" style="color: var(--danger); text-align: center; margin-top: 10px; display: none;"></p>
  </div>
</div>

<div id="main-app" style="display: none;" class="container">
  <div id="navTabs" style="display: flex; gap: 10px; overflow-x: auto; padding-bottom: 15px; margin-bottom: 20px;"></div>

  <!-- 1. MATERI UTAMA (PASTI MUNCUL) -->
  <div class="materi-box">
    <h3 style="color: var(--primary); margin-top: 0;">📖 1. BACA MATERI UTAMA DULU</h3>
    <div id="materi-content"></div>
  </div>

  <!-- 2. 10 BLOK ANALISIS MENDALAM -->
  <h3 style="color: var(--primary); border-bottom: 2px solid var(--primary); padding-bottom: 8px;">📝 2. Analisis Mendalam (10 Bagian)</h3>
  <div id="analysis-container"></div>

  <!-- 3. 10 SOAL HOTS -->
  <h3 style="color: var(--accent); border-bottom: 2px solid var(--accent); padding-bottom: 8px; margin-top: 30px;">🧠 3. Soal HOTS (Higher Order Thinking Skills)</h3>
  <div id="hots-container"></div>

  <!-- 4. 5 SOAL MCMA -->
  <h3 style="color: var(--secondary); border-bottom: 2px solid var(--secondary); padding-bottom: 8px; margin-top: 30px;">✅ 4. Pilihan Ganda Kompleks (MCMA)</h3>
  <div id="mcma-container"></div>

  <!-- 5. 5 SOAL TRUE/FALSE -->
  <h3 style="color: var(--success); border-bottom: 2px solid var(--success); padding-bottom: 8px; margin-top: 30px;">⚖️ 5. True or False</h3>
  <div id="tf-container"></div>
</div>

<script>
  const GAS_API_URL = 'https://script.google.com/macros/s/AKfycbww_eDl2hXqE44UQe7A1wRR19dtiFW3gLp-lWg1Te7URmLSb8yrfGrx3nAdQv7GsLLDGw/exec'; // GANTI DENGAN URL DEPLOY ANDA
  let activeUser = { nama: '', kelas: '' };
  let currentSheet = '';
  let sheetData = null;

  // Variabel Global untuk Recorder
  let mediaRecorder = null, audioChunks = [], recognition = null, finalTranscript = '', isRecording = false;
  let currentActiveBlockId = null;

  async function callGas(action, payload) {
    try {
      const res = await fetch(GAS_API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: action, payload: payload })
      });
      return await res.json();
    } catch (err) {
      return { success: false, message: 'Koneksi gagal: ' + err.message };
    }
  }

  async function executeLogin() {
    const nama = document.getElementById('inputNama').value;
    const pass = document.getElementById('inputPass').value;
    const kelas = document.getElementById('inputKelas').value;
    if (!nama || !pass) { alert('Nama dan Password wajib diisi!'); return; }

    const btn = event.target;
    btn.disabled = true; btn.innerText = 'Memproses...';
    
    const res = await callGas('login', { nama: nama, password: pass, kelas: kelas });
    btn.disabled = false; btn.innerText = 'Enter / Masuk';

    if (res.success) {
      activeUser = { nama: res.nama, kelas: res.kelas };
      document.getElementById('login-container').style.display = 'none';
      document.getElementById('main-app').style.display = 'block';
      document.getElementById('userDisplay').innerText = `Siswa: ${activeUser.nama} | Kelas: ${activeUser.kelas}`;
      buildNavTabs(res.availableSheets);
    } else {
      document.getElementById('loginError').innerText = res.message;
      document.getElementById('loginError').style.display = 'block';
    }
  }

  function buildNavTabs(sheets) {
    const nav = document.getElementById('navTabs');
    nav.innerHTML = '';
    sheets.forEach((sheetName, index) => {
      const btn = document.createElement('button');
      btn.className = 'btn';
      btn.style.backgroundColor = index === 0 ? 'var(--secondary)' : '#e2e8f0';
      btn.style.color = index === 0 ? 'white' : 'var(--text)';
      btn.innerText = sheetName;
      btn.onclick = () => loadSheet(sheetName, btn);
      nav.appendChild(btn);
    });
    if (sheets.length > 0) loadSheet(sheets[0], nav.firstChild);
  }

  async function loadSheet(sheetName, btnElement) {
    currentSheet = sheetName;
    document.getElementById('sheetTitleDisplay').innerText = sheetName;
    
    const buttons = document.getElementById('navTabs').querySelectorAll('button');
    buttons.forEach(b => { b.style.backgroundColor = '#e2e8f0'; b.style.color = 'var(--text)'; });
    btnElement.style.backgroundColor = 'var(--secondary)';
    btnElement.style.color = 'white';

    const res = await callGas('getSheetData', { sheetName: sheetName, studentName: activeUser.nama });
    if (!res.success) { alert(res.message); return; }
    
    sheetData = res;
    renderMateri(res.materi);
    renderAnalysisBlocks(res.analysisBlocks, res.submissions);
    renderHOTS(res.hotsQuestions);
    renderMCMA(res.mcma);
    renderTF(res.trueFalse);
  }

  function renderMateri(materi) {
    document.getElementById('materi-content').innerHTML = `
      <div class="pronounce-block">${materi.pronounce}</div>
      <p style="font-size: 1.05rem; line-height: 1.8; white-space: pre-wrap;">${materi.en}</p>
      <div style="background: #f0fdf4; border-left: 4px solid var(--success); padding: 15px; border-radius: 4px; margin-top: 15px; color: #15803d;">
        <strong>🇮🇩 Terjemahan:</strong><br>
        <span style="white-space: pre-wrap;">${materi.id}</span>
      </div>
    `;
  }

  function toggleAccordion(header) {
    if (isRecording) stopRecording(); 
    header.classList.toggle('active');
    const content = header.nextElementSibling;
    content.classList.toggle('show');
  }

  function renderAnalysisBlocks(blocks, submissions) {
    const container = document.getElementById('analysis-container');
    container.innerHTML = '';
    blocks.forEach((block, idx) => {
      const isDone = submissions[block.id];
      const statusIcon = isDone ? (parseFloat(isDone.akurasi) >= 60 ? '✅' : '⚠️') : '⭕';
      
      let html = `
        <div class="accordion-item">
          <div class="accordion-header" onclick="toggleAccordion(this)">
            <span>${statusIcon} Bagian ${idx + 1}: ${block.title}</span>
            <span>▼</span>
          </div>
          <div class="accordion-content">
            <div class="pronounce-block">${block.instrPron}</div>
            <p style="white-space: pre-wrap;">${block.instrEn}</p>
            <p style="color: #15803d; font-weight: 500;"><strong>🇮🇩 ${block.instrId}</strong></p>
      `;

      if (isDone) {
        html += `
          <div class="feedback-box" style="display: block;">
            <p><strong>Jawaban Anda:</strong> ${isDone.jawabanId}</p>
            <p><strong>Terjemahan:</strong> ${isDone.jawabanEn}</p>
            <p><strong>Akurasi:</strong> <span style="color: var(--secondary); font-weight: bold;">${isDone.akurasi}</span></p>
            <p><strong>Feedback Guru:</strong> ${isDone.feedbackId}</p>
            ${isDone.audioUrl ? `<a href="${isDone.audioUrl}" target="_blank" class="btn btn-primary" style="margin-top:10px; text-decoration:none;">🎧 Dengarkan Rekaman</a>` : ''}
          </div>
        `;
      } else {
        html += `
          <textarea id="input_${block.id}" placeholder="Tulis jawaban analisis Anda di sini (Bahasa Indonesia)..."></textarea>
          <button class="btn btn-primary" onclick="processAnalysisAnswer('${block.id}', ${block.colJawabId}, ${block.colJawabEn}, ${block.colAudio}, ${block.colTranskrip}, ${block.colPenilaian}, ${block.colAkurasi}, ${block.colFeedbackEn}, ${block.colFeedbackId})">
            📤 Terjemahkan & Siapkan Rekam
          </button>
          <div id="recorder_area_${block.id}" style="display: none; margin-top: 15px;">
            <div class="recorder-box">
              <p><strong>📖 Bacalah teks ini dengan lantang:</strong></p>
              <p id="en_text_${block.id}" style="background: #fff; padding: 10px; border-radius: 6px; border: 1px solid #e2e8f0;"></p>
              <div style="text-align: center; margin: 20px 0;">
                <button class="btn-record" id="btn_record_${block.id}" onclick="toggleRecording('${block.id}')">🎙️ MULAI REKAM</button>
              </div>
              <p id="record_status_${block.id}" class="recorder-status">Siap merekam. Klik tombol di atas.</p>
              <div id="liveTranscriptBox_${block.id}" class="live-transcript-box">
                <strong>📝 Transkrip Suara Anda (Real-time):</strong>
                <div id="liveTranscriptText_${block.id}" style="color: #64748b; font-style: italic; margin-top: 5px;">Mulai bicara...</div>
              </div>
              <audio id="audioPlayback_${block.id}" controls style="width: 100%; margin-top: 15px; display: none;"></audio>
            </div>
            <button class="btn btn-success" style="width: 100%; margin-top: 15px; justify-content: center;" id="btn_submit_${block.id}" onclick="finalSubmit('${block.id}')" disabled>
              ✅ Kirim Jawaban & Penilaian ke Guru
            </button>
          </div>
        `;
      }
      html += `</div></div>`;
      container.innerHTML += html;
    });
  }

  async function processAnalysisAnswer(blockId, colJawabId, colJawabEn, colAudio, colTranskrip, colPenilaian, colAkurasi, colFeedbackEn, colFeedbackId) {
    const text = document.getElementById(`input_${blockId}`).value;
    if (text.length < 30) { alert('Jawaban terlalu pendek! Minimal jelaskan dengan 1-2 kalimat.'); return; }
    
    const res = await callGas('getInstantTranslation', { text: text });
    if (res.success) {
      document.getElementById(`en_text_${blockId}`).innerText = res.jawabanEn;
      document.getElementById(`recorder_area_${blockId}`).style.display = 'block';
      
      // Simpan mapping kolom ke elemen agar mudah diambil saat submit
      const el = document.getElementById(`recorder_area_${blockId}`);
      el.dataset.colJawabId = colJawabId;
      el.dataset.colJawabEn = colJawabEn;
      el.dataset.colAudio = colAudio;
      el.dataset.colTranskrip = colTranskrip;
      el.dataset.colPenilaian = colPenilaian;
      el.dataset.colAkurasi = colAkurasi;
      el.dataset.colFeedbackEn = colFeedbackEn;
      el.dataset.colFeedbackId = colFeedbackId;
      
      document.getElementById(`recorder_area_${blockId}`).scrollIntoView({ behavior: 'smooth' });
    } else {
      alert('Gagal menerjemahkan: ' + res.message);
    }
  }

  function toggleRecording(blockId) {
    if (isRecording) { stopRecording(); } else { startRecording(blockId); }
  }

  function startRecording(blockId) {
    currentActiveBlockId = blockId;
    finalTranscript = ''; audioChunks = []; isRecording = true;

    const btn = document.getElementById(`btn_record_${blockId}`);
    const status = document.getElementById(`record_status_${blockId}`);
    const transcriptBox = document.getElementById(`liveTranscriptBox_${blockId}`);
    const transcriptText = document.getElementById(`liveTranscriptText_${blockId}`);

    btn.innerText = '⏹ SELESAI REKAM';
    btn.classList.add('recording');
    status.innerText = '🔴 SEDANG MEREKAM... Bacalah teks Bahasa Inggris di atas!';
    status.classList.add('recording');
    transcriptBox.style.display = 'block';

    navigator.mediaDevices.getUserMedia({ audio: true }).then(function(stream) {
      mediaRecorder = new MediaRecorder(stream);
      mediaRecorder.ondataavailable = function(e) { if (e.data && e.data.size > 0) audioChunks.push(e.data); };
      mediaRecorder.onstop = function() {
        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
        const url = URL.createObjectURL(audioBlob);
        const playback = document.getElementById(`audioPlayback_${blockId}`);
        playback.src = url; playback.style.display = 'block';
        
        const reader = new FileReader();
        reader.onload = function(e) {
          const base64 = e.target.result.split(',')[1];
          playback.dataset.base64 = base64;
          playback.dataset.duration = Math.max(1, Math.round(audioBlob.size / 1000)); // Estimasi durasi
          document.getElementById(`btn_submit_${blockId}`).disabled = false;
        };
        reader.readAsDataURL(audioBlob);
        stream.getTracks().forEach(t => t.stop());
      };
      mediaRecorder.start();

      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (SpeechRecognition) {
        recognition = new SpeechRecognition();
        recognition.lang = 'en-US'; recognition.continuous = true; recognition.interimResults = true;
        recognition.onresult = function(event) {
          let interim = '';
          for (let i = event.resultIndex; i < event.results.length; i++) {
            const transcriptPart = event.results[i][0].transcript;
            if (event.results[i].isFinal) { finalTranscript += ' ' + transcriptPart; } else { interim += transcriptPart; }
          }
          const displayText = (finalTranscript + ' ' + interim).trim();
          if (displayText) {
            transcriptText.innerText = displayText;
            transcriptText.style.color = '#0c4a6e'; transcriptText.style.fontStyle = 'normal';
          }
        };
        recognition.onend = function() { if (isRecording) { try { recognition.start(); } catch (e) {} } };
        try { recognition.start(); } catch (e) { console.warn(e); }
      }
    }).catch(function(err) {
      alert('Tidak bisa mengakses mikrofon: ' + err.message + '\nPastikan Anda mengizinkan akses mikrofon di browser.');
      isRecording = false;
      btn.innerText = '🎙️ MULAI REKAM'; btn.classList.remove('recording');
      status.innerText = 'Gagal mengakses mikrofon.'; status.classList.remove('recording');
    });
  }

  function stopRecording() {
    if (!isRecording) return;
    isRecording = false;
    if (mediaRecorder && mediaRecorder.state !== 'inactive') { mediaRecorder.stop(); }
    if (recognition) { try { recognition.stop(); } catch (e) {} }

    const blockId = currentActiveBlockId;
    const btn = document.getElementById(`btn_record_${blockId}`);
    const status = document.getElementById(`record_status_${blockId}`);
    
    btn.innerText = '🎙️ REKAM ULANG';
    btn.classList.remove('recording');
    status.innerText = '✅ Rekaman selesai. Anda bisa memutar ulang audio, lalu klik tombol Kirim.';
    status.classList.remove('recording');
    
    const playback = document.getElementById(`audioPlayback_${blockId}`);
    playback.dataset.transcript = finalTranscript.trim();
  }

  async function finalSubmit(blockId) {
    const btn = document.getElementById(`btn_submit_${blockId}`);
    btn.disabled = true; btn.innerText = '⏳ Mengunggah & Menganalisis...';

    const recorderArea = document.getElementById(`recorder_area_${blockId}`);
    const playback = document.getElementById(`audioPlayback_${blockId}`);
    
    const base64Audio = playback.dataset.base64;
    const transcript = playback.dataset.transcript || '';
    const englishText = document.getElementById(`en_text_${blockId}`).innerText;
    const indonesianText = document.getElementById(`input_${blockId}`).value;

    if (!base64Audio) { alert('Anda harus merekam suara terlebih dahulu!'); btn.disabled = false; btn.innerText = '✅ Kirim Jawaban & Penilaian ke Guru'; return; }

    const fileName = `${activeUser.nama}_${blockId}_${Date.now()}.webm`;
    const audioRes = await callGas('uploadAudioToDrive', { base64Data: base64Audio, fileName: fileName, mimeType: 'audio/webm' });

    if (!audioRes.success) {
      alert('Gagal mengunggah audio: ' + audioRes.message);
      btn.disabled = false; btn.innerText = '✅ Kirim Jawaban & Penilaian ke Guru';
      return;
    }

    const payload = {
      sheetName: currentSheet,
      studentName: activeUser.nama,
      blockId: blockId,
      jawabanText: indonesianText,
      jawabanEn: englishText,
      audioUrl: audioRes.downloadUrl,
      speechTranscript: transcript,
      similarityScore: 85, // Simulasi, bisa diganti dengan fungsi AI analisis
      feedbackEn: "Excellent analysis of the text structure!",
      feedbackId: "Analisis struktur teks yang sangat bagus! Kamu sudah memahami bagian ini dengan baik.",
      colMap: {
        jawabId: parseInt(recorderArea.dataset.colJawabId),
        jawabEn: parseInt(recorderArea.dataset.colJawabEn),
        audio: parseInt(recorderArea.dataset.colAudio),
        transkrip: parseInt(recorderArea.dataset.colTranskrip),
        penilaian: parseInt(recorderArea.dataset.colPenilaian),
        akurasi: parseInt(recorderArea.dataset.colAkurasi),
        feedbackEn: parseInt(recorderArea.dataset.colFeedbackEn),
        feedbackId: parseInt(recorderArea.dataset.colFeedbackId)
      }
    };

    const res = await callGas('submitStudentAnswer', payload);
    
    if (res.success) {
      alert('✅ Kerja bagus! Jawaban dan rekaman Anda berhasil dikirim.');
      loadSheet(currentSheet, document.querySelector(`button[style*="background-color: var(--secondary)"]`));
    } else {
      alert('Gagal menyimpan: ' + res.message);
      btn.disabled = false; btn.innerText = '✅ Kirim Jawaban & Penilaian ke Guru';
    }
  }

  // Render HOTS, MCMA, TF (Formative / Pembahasan)
  function renderHOTS(questions) {
    const container = document.getElementById('hots-container');
    container.innerHTML = '';
    questions.forEach(q => {
      container.innerHTML += `
        <div class="accordion-item">
          <div class="accordion-header" onclick="toggleAccordion(this)">
            <span>Soal HOTS ${q.num}</span><span>▼</span>
          </div>
          <div class="accordion-content">
            <p style="font-weight: 600;">${q.soalEn}</p>
            <p style="color: #64748b; font-style: italic;">${q.soalId}</p>
            <textarea placeholder="(Opsional) Tulis refleksi atau jawaban singkat Anda di sini sebelum melihat pembahasan..."></textarea>
            <button class="btn btn-primary" onclick="this.nextElementSibling.style.display='block'">💡 Lihat Pembahasan Guru</button>
            <div class="feedback-box" style="display: none;">
              <p><strong>🇬🇧 ${q.feedbackEn}</strong></p>
              <p class="pronounce-block">${q.feedbackPron}</p>
              <p><strong>🇮🇩 ${q.feedbackId}</strong></p>
            </div>
          </div>
        </div>
      `;
    });
  }

  function renderMCMA(mcma) {
    const container = document.getElementById('mcma-container');
    container.innerHTML = `<p style="margin-bottom: 15px; font-style: italic; color: #64748b;">${mcma.instr}</p>`;
    mcma.questions.forEach(q => {
      container.innerHTML += `
        <div class="accordion-item">
          <div class="accordion-header" onclick="toggleAccordion(this)">
            <span>MCMA ${q.num} (Pilih Lebih dari Satu)</span><span>▼</span>
          </div>
          <div class="accordion-content">
            <p style="font-weight: 600;">${q.soalEn}</p>
            <p style="color: #64748b; font-style: italic;">${q.soalId}</p>
            <div class="option-group"><label><input type="checkbox"> Opsi A</label></div>
            <div class="option-group"><label><input type="checkbox"> Opsi B</label></div>
            <div class="option-group"><label><input type="checkbox"> Opsi C</label></div>
            <div class="option-group"><label><input type="checkbox"> Opsi D</label></div>
            <div class="option-group"><label><input type="checkbox"> Opsi E</label></div>
            <button class="btn btn-primary" style="margin-top: 10px;" onclick="this.nextElementSibling.style.display='block'">✅ Cek Jawaban & Pembahasan</button>
            <div class="feedback-box" style="display: none;">
              <p><strong>🇬🇧 ${q.feedbackEn}</strong></p>
              <p><strong>🇮🇩 ${q.feedbackId}</strong></p>
            </div>
          </div>
        </div>
      `;
    });
  }

  function renderTF(tf) {
    const container = document.getElementById('tf-container');
    container.innerHTML = `<p style="margin-bottom: 15px; font-style: italic; color: #64748b;">${tf.instr}</p>`;
    tf.questions.forEach(q => {
      container.innerHTML += `
        <div class="accordion-item">
          <div class="accordion-header" onclick="toggleAccordion(this)">
            <span>True / False ${q.num}</span><span>▼</span>
          </div>
          <div class="accordion-content">
            <p style="font-weight: 600;">${q.statementEn}</p>
            <p style="color: #64748b; font-style: italic;">${q.statementId}</p>
            <div style="display: flex; gap: 20px; margin: 15px 0;">
              <label style="cursor: pointer;"><input type="radio" name="tf_${q.num}" value="TRUE"> TRUE (Benar)</label>
              <label style="cursor: pointer;"><input type="radio" name="tf_${q.num}" value="FALSE"> FALSE (Salah)</label>
            </div>
            <button class="btn btn-primary" onclick="this.nextElementSibling.style.display='block'">✅ Cek Jawaban & Pembahasan</button>
            <div class="feedback-box" style="display: none;">
              <p><strong>Kunci Jawaban:</strong> ${q.answerKey}</p>
              <p><strong>🇬🇧 ${q.feedbackEn}</strong></p>
              <p><strong>🇮🇩 ${q.feedbackId}</strong></p>
            </div>
          </div>
        </div>
      `;
    });
  }
</script>
</body>
</html>
