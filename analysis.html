<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lopo Pelajar - Analisis Teks Deskriptif</title>
  <style>
    :root { --primary: #1b365d; --secondary: #0066cc; --accent: #d97706; --success: #16a34a; --bg: #f8fafc; --card: #ffffff; }
    body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: #1e293b; margin: 0; padding: 0; }
    .header { background: var(--primary); color: white; padding: 20px; text-align: center; }
    .container { max-width: 1000px; margin: 20px auto; padding: 0 20px; }
    .card { background: var(--card); padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 20px; }
    
    /* Tabs */
    .tabs { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 10px; border-bottom: 2px solid #e2e8f0; margin-bottom: 20px; }
    .tab { padding: 10px 20px; background: #e2e8f0; border-radius: 8px 8px 0 0; cursor: pointer; font-weight: 600; white-space: nowrap; }
    .tab.active { background: var(--secondary); color: white; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* Content Blocks */
    .block { border: 1px solid #e2e8f0; border-radius: 8px; padding: 15px; margin-bottom: 15px; background: #fafafa; }
    .block h4 { color: var(--primary); margin-top: 0; }
    .instr-en { font-weight: 600; color: #0f172a; margin-bottom: 5px; }
    .instr-pron { font-style: italic; color: #0369a1; background: #f0f9ff; padding: 8px; border-radius: 4px; margin-bottom: 10px; }
    .instr-id { color: #15803d; margin-bottom: 15px; }
    
    textarea { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; min-height: 100px; box-sizing: border-box; margin-bottom: 10px; }
    .btn { padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; color: white; background: var(--secondary); }
    .btn-success { background: var(--success); }
    .btn:disabled { background: #cbd5e1; cursor: not-allowed; }

    /* Recorder */
    .recorder { background: #fff7ed; padding: 15px; border-radius: 8px; border: 1px solid #fdba74; margin-top: 10px; display: none; }
    .btn-record { background: var(--accent); color: white; padding: 10px 20px; border: none; border-radius: 20px; cursor: pointer; font-weight: bold; }
    .btn-record.recording { background: #dc2626; animation: pulse 1s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
    .transcript-box { background: #f0f9ff; padding: 10px; border-radius: 4px; margin-top: 10px; font-style: italic; color: #0c4a6e; min-height: 40px; }
    .feedback-box { background: #f0fdf4; border-left: 4px solid var(--success); padding: 15px; border-radius: 8px; margin-top: 15px; display: none; }
  </style>
</head>
<body>
  <div class="header">
    <h1>Analisis Teks Deskriptif (People)</h1>
    <p id="userInfo"></p>
  </div>

  <div class="container" id="loginContainer">
    <div class="card" style="max-width: 400px; margin: 40px auto;">
      <h2 style="text-align: center;">Masuk Portal Siswa</h2>
      <input type="text" id="nama" placeholder="Nama Lengkap" style="width: 100%; padding: 12px; margin-bottom: 10px; border: 1px solid #cbd5e1; border-radius: 8px; box-sizing: border-box;">
      <input type="password" id="password" placeholder="Password" style="width: 100%; padding: 12px; margin-bottom: 10px; border: 1px solid #cbd5e1; border-radius: 8px; box-sizing: border-box;">
      <input type="text" id="kelas" placeholder="Kelas" style="width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #cbd5e1; border-radius: 8px; box-sizing: border-box;">
      <button class="btn" style="width: 100%;" onclick="login()">Masuk</button>
      <p id="loginError" style="color: red; text-align: center; display: none;"></p>
    </div>
  </div>

  <div class="container" id="mainApp" style="display: none;">
    <div class="tabs" id="tabsContainer"></div>
    
    <!-- Tab 1: Materi -->
    <div id="tab-materi" class="tab-content active">
      <div class="card">
        <h3>Materi Utama</h3>
        <div id="materiContent"></div>
      </div>
    </div>

    <!-- Tab 2: 10 Analisis -->
    <div id="tab-analisis" class="tab-content">
      <div class="card"><h3>10 Blok Analisis Mendalam</h3><div id="analysisContainer"></div></div>
    </div>

    <!-- Tab 3: 10 HOTS -->
    <div id="tab-hots" class="tab-content">
      <div class="card"><h3>10 Soal HOTS (Diskusi & Analisis)</h3><div id="hotsContainer"></div></div>
    </div>

    <!-- Tab 4: 5 MCMA -->
    <div id="tab-mcma" class="tab-content">
      <div class="card"><h3>5 Soal Pilihan Ganda Kompleks (MCMA)</h3><div id="mcmaContainer"></div></div>
    </div>

    <!-- Tab 5: 5 True/False -->
    <div id="tab-tf" class="tab-content">
      <div class="card"><h3>5 Soal True or False</h3><div id="tfContainer"></div></div>
    </div>
  </div>

  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbww_eDl2hXqE44UQe7A1wRR19dtiFW3gLp-lWg1Te7URmLSb8yrfGrx3nAdQv7GsLLDGw/exec'; // GANTI DENGAN URL DEPLOY ANDA
    let currentUser = '';
    let currentSheet = '';
    let sheetData = {};
    let mediaRecorder, audioChunks = [], recognition, isRecording = false, currentBlockId = '';

    async function apiCall(action, payload) {
      const res = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify({ action, payload }) });
      return await res.json();
    }

    async function login() {
      const nama = document.getElementById('nama').value;
      const pass = document.getElementById('password').value;
      const kelas = document.getElementById('kelas').value;
      const res = await apiCall('login', { nama, password: pass, kelas });
      if (res.success) {
        currentUser = res.nama;
        document.getElementById('userInfo').innerText = `Siswa: ${currentUser}`;
        document.getElementById('loginContainer').style.display = 'none';
        document.getElementById('mainApp').style.display = 'block';
        renderTabs(res.availableSheets);
      } else {
        document.getElementById('loginError').innerText = res.message;
        document.getElementById('loginError').style.display = 'block';
      }
    }

    function renderTabs(sheets) {
      const container = document.getElementById('tabsContainer');
      container.innerHTML = '<div class="tab active" onclick="switchTab(\'materi\', this)">Materi</div>' +
        '<div class="tab" onclick="switchTab(\'analisis\', this)">10 Analisis</div>' +
        '<div class="tab" onclick="switchTab(\'hots\', this)">10 HOTS</div>' +
        '<div class="tab" onclick="switchTab(\'mcma\', this)">5 MCMA</div>' +
        '<div class="tab" onclick="switchTab(\'tf\', this)">5 True/False</div>';
      loadSheet(sheets[0]);
    }

    function switchTab(tabId, el) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
      el.classList.add('active');
      document.getElementById('tab-' + tabId).classList.add('active');
    }

    async function loadSheet(sheetName) {
      currentSheet = sheetName;
      const res = await apiCall('getSheetData', { sheetName, studentName: currentUser });
      if (!res.success) return alert(res.message);
      sheetData = res.data;

      // Render Materi
      document.getElementById('materiContent').innerHTML = `
        <div style="font-style: italic; color: #0369a1; background: #f0f9ff; padding: 10px; border-radius: 4px;">${sheetData.materi.pronounce}</div>
        <p style="white-space: pre-wrap; line-height: 1.8;">${sheetData.materi.en}</p>
        <div style="color: #15803d; background: #f0fdf4; padding: 10px; border-radius: 4px;"><strong>Terjemahan:</strong><br><span style="white-space: pre-wrap;">${sheetData.materi.id}</span></div>
      `;

      // Render 10 Analisis
      const aContainer = document.getElementById('analysisContainer');
      aContainer.innerHTML = '';
      sheetData.analysisBlocks.forEach((blk, idx) => {
        const sub = sheetData.submissions[blk.id];
        let html = `<div class="block"><h4>${idx + 1}. ${blk.title}</h4>`;
        if (sub) {
          html += `<div class="feedback-box" style="display:block;"><strong>Jawaban:</strong> ${sub.jawabanId}<br><strong>Akurasi:</strong> ${sub.akurasi}<br><strong>Feedback:</strong> ${sub.feedbackId}</div>`;
        } else {
          html += `<div class="instr-en">${blk.instrEn}</div><div class="instr-pron">${blk.instrPron}</div><div class="instr-id">${blk.instrId}</div>
            <textarea id="ans_${blk.id}" placeholder="Tulis jawaban analisis Anda di sini (Bahasa Indonesia)..."></textarea>
            <button class="btn" onclick="prepareRecord('${blk.id}')">Terjemahkan & Rekam</button>
            <div id="rec_${blockId}" class="recorder">
              <p><strong>Teks Inggris:</strong> <span id="en_${blk.id}"></span></p>
              <button class="btn-record" id="btnRec_${blk.id}" onclick="toggleRecord('${blk.id}')">🎙️ MULAI REKAM</button>
              <div id="trans_${blk.id}" class="transcript-box" style="display:none;">Mulai bicara...</div>
              <audio id="aud_${blk.id}" controls style="width:100%; margin-top:10px; display:none;"></audio>
              <button class="btn btn-success" style="margin-top:10px; display:none;" id="btnSub_${blk.id}" onclick="submitAnalysis('${blk.id}')">Kirim Jawaban</button>
            </div>`;
        }
        html += `</div>`;
        aContainer.innerHTML += html;
      });

      // Render HOTS
      const hContainer = document.getElementById('hotsContainer');
      hContainer.innerHTML = '';
      sheetData.hotsQuestions.forEach(q => {
        hContainer.innerHTML += `<div class="block"><h4>Soal HOTS ${q.num}</h4><p>${q.soalEn}</p><p style="color:#64748b">${q.soalId}</p>
          <textarea placeholder="Tulis diskusi/jawaban analisis Anda..."></textarea>
          <button class="btn" onclick="alert('Fitur diskusi tersimpan (simulasi). Feedback Guru: ' + 'Silakan diskusikan lebih lanjut dengan teman.')">Kirim Diskusi</button></div>`;
      });

      // Render MCMA
      const mContainer = document.getElementById('mcmaContainer');
      mContainer.innerHTML = '';
      sheetData.mcmaQuestions.forEach(q => {
        mContainer.innerHTML += `<div class="block"><h4>MCMA ${q.num}</h4><p>${q.soalEn}</p><p style="color:#64748b">${q.soalId}</p>
          <textarea placeholder="Tulis jawaban/analisis pilihan Anda di sini..."></textarea>
          <button class="btn" onclick="alert('Jawaban MCMA tersimpan. Feedback: ' + 'Periksa kembali pilihan Anda berdasarkan teks.')">Kirim Jawaban</button></div>`;
      });

      // Render True/False
      const tContainer = document.getElementById('tfContainer');
      tContainer.innerHTML = '';
      sheetData.tfQuestions.forEach(q => {
        tContainer.innerHTML += `<div class="block"><h4>True/False ${q.num}</h4><p>${q.statementEn}</p><p style="color:#64748b">${q.statementId}</p>
          <label><input type="radio" name="tf_${q.id}" value="TRUE"> TRUE</label> 
          <label><input type="radio" name="tf_${q.id}" value="FALSE"> FALSE</label><br><br>
          <button class="btn" onclick="alert('Jawaban T/F tersimpan. Kunci: ' + '${q.answerKey}')">Kirim Jawaban</button></div>`;
      });
    }

    async function prepareRecord(blockId) {
      const text = document.getElementById(`ans_${blockId}`).value;
      if (text.length < 20) return alert('Jawaban terlalu pendek!');
      const res = await apiCall('getInstantTranslation', { text });
      if (res.success) {
        document.getElementById(`en_${blockId}`).innerText = res.jawabanEn;
        document.getElementById(`rec_${blockId}`).style.display = 'block';
        currentBlockId = blockId;
      }
    }

    function toggleRecord(blockId) {
      const btn = document.getElementById(`btnRec_${blockId}`);
      const transBox = document.getElementById(`trans_${blockId}`);
      
      if (!isRecording) {
        isRecording = true; currentBlockId = blockId; audioChunks = [];
        btn.innerText = '⏹ SELESAI'; btn.classList.add('recording');
        transBox.style.display = 'block';

        navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
          mediaRecorder = new MediaRecorder(stream);
          mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
          mediaRecorder.onstop = () => {
            const blob = new Blob(audioChunks, { type: 'audio/webm' });
            const url = URL.createObjectURL(blob);
            const aud = document.getElementById(`aud_${blockId}`);
            aud.src = url; aud.style.display = 'block';
            document.getElementById(`btnSub_${blockId}`).style.display = 'block';
            stream.getTracks().forEach(t => t.stop());
            
            // Convert to base64 for submission
            const reader = new FileReader();
            reader.onload = e => { window.currentBase64 = e.target.result.split(',')[1]; };
            reader.readAsDataURL(blob);
          };
          mediaRecorder.start();

          recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
          recognition.lang = 'en-US'; recognition.continuous = true; recognition.interimResults = true;
          recognition.onresult = e => {
            let final = '', interim = '';
            for (let i = e.resultIndex; i < e.results.length; i++) {
              if (e.results[i].isFinal) final += e.results[i][0].transcript + ' ';
              else interim += e.results[i][0].transcript;
            }
            document.getElementById(`trans_${blockId}`).innerText = final + interim;
            window.currentTranscript = final.trim();
          };
          recognition.start();
        });
      } else {
        isRecording = false;
        btn.innerText = '🎙️ REKAM ULANG'; btn.classList.remove('recording');
        if (mediaRecorder) mediaRecorder.stop();
        if (recognition) recognition.stop();
      }
    }

    async function submitAnalysis(blockId) {
      if (!window.currentBase64) return alert('Rekam suara terlebih dahulu!');
      const btn = document.getElementById(`btnSub_${blockId}`);
      btn.disabled = true; btn.innerText = 'Mengirim...';

      const fileName = `${currentUser}_${blockId}_${Date.now()}.webm`;
      const audioRes = await apiCall('uploadAudioToDrive', { base64Data: window.currentBase64, fileName, mimeType: 'audio/webm' });
      
      const blk = sheetData.analysisBlocks.find(b => b.id === blockId);
      const payload = {
        sheetName: currentSheet, studentName: currentUser, blockId,
        jawabanText: document.getElementById(`ans_${blockId}`).value,
        jawabanEn: document.getElementById(`en_${blockId}`).innerText,
        audioUrl: audioRes.downloadUrl, speechTranscript: window.currentTranscript || '',
        similarityScore: 85, // Simulasi skor, bisa diganti dengan logika AI Anda
        colIndices: { jawabId: blk.colJawabId, jawabEn: blk.colJawabEn, audio: blk.colAudio, transkrip: blk.colTranskrip, penilaian: blk.colPenilaian, akurasi: blk.colAkurasi, feedbackEn: blk.colFeedbackEn, feedbackId: blk.colFeedbackId }
      };

      const res = await apiCall('submitStudentAnswer', payload);
      if (res.success) {
        alert('Berhasil dikirim! Akurasi: ' + res.akurasi);
        loadSheet(currentSheet); // Refresh untuk tampilkan feedback
      } else {
        alert('Gagal: ' + res.message);
        btn.disabled = false; btn.innerText = 'Kirim Jawaban';
      }
    }
  </script>
</body>
</html>
