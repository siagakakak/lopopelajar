<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lopo Pelajar 2 - Analisis Descriptive Text (HOTS)</title>
<style>
:root{--primary:#1b365d;--secondary:#0066cc;--accent:#d97706;--danger:#dc2626;--success:#16a34a;--bg:#f8fafc;--text:#1e293b}
*{box-sizing:border-box}
body{font-family:'Segoe UI',sans-serif;line-height:1.7;color:var(--text);background-color:var(--bg);margin:0;padding:0}
.header-banner{background-color:var(--primary);color:white;padding:20px;text-align:center;box-shadow:0 4px 6px rgba(0,0,0,.1)}
.header-banner h1{margin:0;font-size:1.6rem}
.header-banner p{margin:5px 0 0;font-size:.9rem;opacity:.9}
.nav-bar{display:flex;background:#0f172a;overflow-x:auto;padding:0 10px}
.nav-tab{padding:14px 20px;color:#94a3b8;cursor:pointer;font-weight:600;white-space:nowrap;border-bottom:3px solid transparent;transition:.2s}
.nav-tab.active{color:#fff;border-bottom-color:var(--secondary);background:rgba(255,255,255,.05)}
.sub-nav-bar{display:flex;background:#334155;overflow-x:auto;padding:0 10px}
.sub-nav-tab{padding:12px 18px;color:#cbd5e1;cursor:pointer;font-weight:600;white-space:nowrap;border-bottom:2px solid transparent;transition:.2s;font-size:.9rem}
.sub-nav-tab.active{color:#fff;border-bottom-color:var(--accent);background:rgba(0,0,0,.2)}
.q-tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;margin-bottom:15px;border-bottom:2px solid #e2e8f0;flex-wrap:wrap}
.q-tab{padding:8px 14px;background:#e2e8f0;color:#334155;border-radius:8px;cursor:pointer;font-weight:600;font-size:.85rem;white-space:nowrap}
.q-tab.active{background:var(--secondary);color:#fff}
.q-tab.answered{border-left:4px solid var(--success)}
.q-tab.correct{background:#d1fae5;color:#065f46;border-left:4px solid var(--success)}
.q-tab.wrong{background:#fee2e2;color:#991b1b;border-left:4px solid var(--danger)}
.container{max-width:900px;margin:20px auto;padding:0 20px}
.container-wide{width:100%;margin:15px 0;padding:0 15px}
.card{background:#fff;padding:25px;margin-bottom:20px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.05);border:1px solid #e2e8f0}
.login-card{max-width:400px;margin:60px auto}
.sec-title{color:var(--primary);font-size:1.3rem;margin-top:0;border-bottom:2px solid #e2e8f0;padding-bottom:8px}
.fmt-p{font-size:1.05rem;font-weight:500;color:#0f172a;margin-bottom:12px;text-align:justify}
.pron-block{background:#f0f9ff;border-left:4px solid var(--secondary);padding:15px 20px;color:#0369a1;font-style:italic;border-radius:4px;margin-bottom:20px;line-height:1.8;font-size:1.05rem}
.trans-block{background:#f0fdf4;border-left:4px solid var(--success);padding:15px 20px;color:#15803d;border-radius:4px;margin-bottom:20px;line-height:1.8;font-size:1.05rem}
.instr-block{background:#fff7ed;border-left:4px solid var(--accent);padding:16px;border-radius:4px;margin-bottom:15px;font-size:1rem;line-height:1.7}
.audio-ctrl{display:flex;gap:10px;align-items:center;margin:12px 0;flex-wrap:wrap}
.btn-audio{border:none;padding:6px 12px;border-radius:16px;cursor:pointer;font-weight:600;font-size:.8rem;color:#fff}
.btn-play-en{background:var(--secondary)}
.btn-play-id{background:var(--success)}
.btn-stop{background:var(--danger)}
.speed-tag{font-size:.75rem;background:#e2e8f0;padding:3px 8px;border-radius:10px;font-weight:bold}
.form-group{margin-bottom:15px}
label{display:block;font-weight:600;margin-bottom:6px}
input[type=text],input[type=password],select,textarea{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:8px;font-family:inherit;font-size:1rem;background:#fff}
.pw-wrap{position:relative;display:flex;align-items:center}
.pw-wrap input{padding-right:45px}
.toggle-pw{position:absolute;right:12px;cursor:pointer;font-size:1.2rem;color:#64748b}
textarea{height:140px;resize:vertical}
.char-count{font-size:.85rem;text-align:right;color:#64748b;margin-top:4px}
.char-count.valid{color:var(--success);font-weight:bold}
.btn-submit{background:var(--success);color:#fff;border:none;padding:12px 20px;border-radius:8px;width:100%;font-size:1rem;font-weight:bold;cursor:pointer;margin-top:10px}
.btn-submit:disabled{background:#cbd5e1;cursor:not-allowed}
.btn-reupload{background:var(--accent)}
.alert{padding:12px;border-radius:8px;margin-top:15px;display:none}
.alert-danger{background:#fef2f2;color:#991b1b;border:1px solid #fecaca}
.alert-success{background:#f0fdf4;color:#15803d;border:1px solid #bbf7d0}
.speak-result{background:#fff7ed;border:1px solid #fdba74;padding:15px;border-radius:8px;margin-top:15px}
.modal-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.7);z-index:1000;justify-content:center;align-items:center}
.modal-overlay.active{display:flex}
.modal-content{background:#fff;border-radius:16px;padding:30px;max-width:700px;width:90%;max-height:90vh;overflow-y:auto}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;padding-bottom:15px;border-bottom:2px solid #e2e8f0}
.modal-title{font-size:1.3rem;color:var(--primary);margin:0}
.modal-close{background:var(--danger);color:#fff;border:none;width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:1.2rem}
.drive-player iframe{width:100%;height:200px;border:none;border-radius:8px}
.saved-preview{background:#f0fdf4;border:1px solid #86efac;padding:15px;border-radius:8px;margin-bottom:20px;border-left:4px solid var(--success)}
.descriptive-feedback{background:#fff;border-radius:12px;padding:20px;margin-top:15px;border:2px solid #e2e8f0}
.teacher-feedback{background:#eff6ff;border:2px solid var(--secondary);border-radius:12px;padding:20px;margin-top:20px}
.reupload-section{background:#fef2f2;border:2px solid var(--danger);border-radius:12px;padding:20px;margin-top:20px}
.reupload-required{background:#fee2e2;color:#991b1b;padding:12px;border-radius:8px;margin-bottom:15px;font-weight:bold}
.recorder-box{background:#fff7ed;padding:20px;border-radius:8px;border:1px solid #fdba74}
.btn-record{background:var(--danger);color:#fff;border:none;padding:14px 24px;border-radius:50px;font-size:1.1rem;font-weight:bold;cursor:pointer;box-shadow:0 4px 12px rgba(220,38,38,.3)}
.btn-record.recording{background:#991b1b;animation:pulseRec 1s infinite}
@keyframes pulseRec{0%,100%{opacity:1}50%{opacity:.6}}
.btn-record:disabled{background:#cbd5e1;cursor:not-allowed}
.transcript-box{background:#f0f9ff;border-left:4px solid var(--secondary);padding:12px 16px;margin-top:15px;border-radius:4px;min-height:50px;font-size:.95rem;color:#0c4a6e}
.rec-status{font-size:.95rem;margin-top:10px;color:#7c2d12;font-weight:600}
.rec-status.recording{color:var(--danger)}
.rec-status.done{color:var(--success)}
.audio-playback{width:100%;margin-top:15px;display:none}
.quiz-card{background:#fff;border:2px solid #e2e8f0;border-radius:12px;padding:20px;margin-bottom:20px}
.quiz-card.correct{border-color:var(--success);background:#f0fdf4}
.quiz-card.wrong{border-color:var(--danger);background:#fef2f2}
.quiz-q-text{font-size:1.05rem;font-weight:600;color:#0f172a;margin-bottom:15px;line-height:1.6}
.quiz-opt{display:block;width:100%;text-align:left;padding:12px 16px;margin-bottom:8px;border:2px solid #cbd5e1;background:#fff;border-radius:8px;cursor:pointer;font-size:.95rem;font-family:inherit;transition:.15s}
.quiz-opt:hover:not(:disabled){border-color:var(--secondary);background:#f0f9ff}
.quiz-opt.selected{border-color:var(--secondary);background:#dbeafe;font-weight:600}
.quiz-opt.correct-opt{border-color:var(--success);background:#d1fae5}
.quiz-opt.wrong-opt{border-color:var(--danger);background:#fee2e2}
.quiz-opt:disabled{cursor:not-allowed;opacity:.85}
.tf-btns{display:flex;gap:15px;margin-top:15px}
.tf-btn{flex:1;padding:16px;border:2px solid #cbd5e1;background:#fff;border-radius:8px;cursor:pointer;font-size:1.1rem;font-weight:600;font-family:inherit;transition:.15s}
.tf-btn:hover:not(:disabled){border-color:var(--secondary);background:#f0f9ff}
.tf-btn.selected{border-color:var(--secondary);background:#dbeafe}
.tf-btn.correct-tf{border-color:var(--success);background:#d1fae5;color:#065f46}
.tf-btn.wrong-tf{border-color:var(--danger);background:#fee2e2;color:#991b1b}
.tf-btn:disabled{cursor:not-allowed;opacity:.85}
.quiz-feedback{margin-top:15px;padding:15px;border-radius:8px;font-size:.95rem;line-height:1.7}
.quiz-feedback.correct{background:#d1fae5;border-left:4px solid var(--success)}
.quiz-feedback.wrong{background:#fee2e2;border-left:4px solid var(--danger)}
.score-badge{display:inline-block;padding:6px 14px;background:var(--secondary);color:#fff;border-radius:20px;font-weight:bold;font-size:.9rem;margin-left:10px}
.score-badge.success{background:var(--success)}
.score-badge.danger{background:var(--danger)}
.quiz-header{background:#eff6ff;border-radius:12px;padding:15px;margin-bottom:20px;border:1px solid #bfdbfe}
.quiz-header h3{margin:0 0 8px;color:var(--primary);font-size:1.1rem}
.quiz-header p{margin:0;font-size:.9rem;color:#475569}
</style>
</head>
<body>
<div class="header-banner">
  <h1>🎓 Lopo Pelajar 2 - Analisis Descriptive Text (HOTS)</h1>
  <p>Teks Analisis | 10 Analisis Struktur | PG | MCMA | True/False</p>
</div>

<div id="login-container" class="container">
  <div class="card login-card">
    <h2 class="sec-title">Masuk Portal Siswa</h2>
    <form onsubmit="executeLogin(event)">
      <div class="form-group"><label>Nama Lengkap</label><input type="text" id="inputNama" required></div>
      <div class="form-group">
        <label>Kelas</label>
        <select id="inputKelas" required>
          <option value="" disabled selected>-- Pilih Kelas --</option>
          <option value="7A">7A</option><option value="7B">7B</option><option value="7C">7C</option><option value="7D">7D</option>
          <option value="7E">7E</option><option value="7F">7F</option><option value="7G">7G</option><option value="7H">7H</option>
          <option value="7I">7I</option><option value="7J">7J</option><option value="7K">7K</option><option value="7L">7L</option>
          <option value="7M">7M</option><option value="7N">7N</option><option value="7O">7O</option><option value="7P">7P</option>
          <option value="7Q">7Q</option><option value="7R">7R</option><option value="7S">7S</option><option value="7T">7T</option>
          <option value="7U">7U</option><option value="7V">7V</option><option value="7W">7W</option><option value="7X">7X</option>
          <option value="7Y">7Y</option><option value="7Z">7Z</option>
        </select>
      </div>
      <div class="form-group">
        <label>Password</label>
        <div class="pw-wrap">
          <input type="password" id="inputPass" required>
          <span class="toggle-pw" id="toggleEye" onclick="togglePw()">👁️</span>
        </div>
      </div>
      <button type="submit" class="btn-submit" id="btnLogin">Masuk</button>
    </form>
    <div id="loginError" class="alert alert-danger"></div>
  </div>
</div>

<div id="main-app" style="display:none;">
  <div class="nav-bar" id="navTabs"></div>
  <div class="sub-nav-bar" id="subNavTabs"></div>
  <div class="container-wide" id="mainContent"></div>
</div>

<div id="audioModal" class="modal-overlay" onclick="closeAudioModalOnOverlay(event)">
  <div class="modal-content" onclick="event.stopPropagation()">
    <div class="modal-header">
      <h3 class="modal-title">🎧 Rekaman Suara Anda</h3>
      <button class="modal-close" onclick="closeAudioModal()">✕</button>
    </div>
    <div class="drive-player">
      <p style="margin:0 0 10px;font-weight:600">Dengarkan rekaman Anda:</p>
      <iframe id="driveAudioFrame" src="" allow="autoplay"></iframe>
    </div>
  </div>
</div>

<script>
const GAS_API_URL = 'https://script.google.com/macros/s/AKfycbzD9RiodUYEoayAoht97ZXn8j9FDefFmF7BOO2_HIzhLQlrybdTThd6vGipsVkB0AvMiA/exec';

let activeUser = { nama: '' };
let currentSheet = '';
let currentSubTab = 'materi';
let currentAnalysisNum = 1;
let currentSheetData = null;
let availableVoices = [];
let originalEnglishText = '';
let submittedAnswerText = '';
let currentAudioUrl = '';
let mediaRecorder = null;
let audioChunks = [];
let recognition = null;
let finalTranscript = '';
let isRecording = false;
let recordStartTime = 0;
let audioBlobGlobal = null;
let mrReupload = null;
let chunksReupload = [];
let recogReupload = null;
let finalTransReup = '';
let isRecReup = false;
let recStartReup = 0;
let blobReup = null;
let pgLocalAnswers = {};
let mcmaLocalAnswers = {};
let tfLocalAnswers = {};

function loadVoices() { availableVoices = window.speechSynthesis.getVoices(); }
loadVoices();
if (window.speechSynthesis.onvoiceschanged !== undefined) window.speechSynthesis.onvoiceschanged = loadVoices;

function getIDVoice() {
  return availableVoices.find(x => x.lang === 'id-ID' && x.name.toLowerCase().includes('google')) || availableVoices.find(x => x.lang === 'id-ID') || availableVoices.find(x => x.lang.toLowerCase().startsWith('id')) || null;
}
function getENVoice() {
  return availableVoices.find(x => x.lang === 'en-US' && x.name.toLowerCase().includes('google')) || availableVoices.find(x => x.lang === 'en-US') || availableVoices.find(x => x.lang.startsWith('en')) || null;
}
function togglePw() {
  const p = document.getElementById('inputPass'), e = document.getElementById('toggleEye');
  if (p.type === 'password') { p.type = 'text'; e.innerText = '🙈'; } else { p.type = 'password'; e.innerText = '👁️'; }
}
function parseAccuracy(val) {
  if (val === null || val === undefined || val === '') return 0;
  var s = String(val).trim(); if (s === '') return 0;
  var hasP = s.indexOf('%') !== -1; var n = hasP ? parseFloat(s.replace('%','').trim()) : parseFloat(s);
  if (isNaN(n)) return 0;
  if (!hasP && n > 0 && n <= 1) n = n * 100;
  n = Math.round(n); if (n > 100) n = 100; if (n < 0) n = 0;
  return n;
}
function determineCat(acc) { if (acc >= 80) return 4; if (acc >= 60) return 3; if (acc >= 40) return 2; return 1; }

async function callGas(action, payload) {
  try {
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 25000);
    const formData = new URLSearchParams();
    formData.append('payload', JSON.stringify({ action, payload }));

    const res = await fetch(GAS_API_URL, { method: 'POST', body: formData, signal: controller.signal });
    clearTimeout(timeoutId);
    const text = await res.text();
    try { return JSON.parse(text); } 
    catch(e) { return { success: false, message: 'Respon server tidak valid. Pastikan GAS di-deploy sebagai "Anyone".' }; }
  } catch (err) { return { success: false, message: 'Koneksi gagal/timeout: ' + err.message }; }
}

async function executeLogin(e) {
  e.preventDefault();
  const nama = document.getElementById('inputNama').value;
  const pass = document.getElementById('inputPass').value;
  const kelas = document.getElementById('inputKelas').value;
  const btn = document.getElementById('btnLogin'), err = document.getElementById('loginError');
  
  btn.disabled = true; btn.innerText = 'Memuat...'; err.style.display = 'none';
  const res = await callGas('login', { nama, password: pass, kelas: kelas });
  btn.disabled = false; btn.innerText = 'Masuk';
  
  if (res.success) {
    activeUser.nama = res.nama;
    document.getElementById('login-container').style.display = 'none';
    document.getElementById('main-app').style.display = 'block';
    buildNavTabs(res.availableSheets);
  } else { err.innerText = res.message; err.style.display = 'block'; }
}

function buildNavTabs(sheets) {
  const nav = document.getElementById('navTabs'); nav.innerHTML = '';
  sheets.forEach(function(name, idx) {
    const tab = document.createElement('div');
    tab.className = 'nav-tab' + (idx === 0 ? ' active' : '');
    tab.innerText = '📖 ' + name;
    tab.onclick = function() {
      document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      loadSheet(name);
    };
    nav.appendChild(tab);
  });
  if (sheets.length > 0) loadSheet(sheets[0]);
}

function buildSubNav() {
  const sub = document.getElementById('subNavTabs'); sub.innerHTML = '';
  const tabs = [
    { id: 'materi', label: '📚 Materi Teks' },
    { id: 'analisis', label: '🔍 10 Analisis HOTS' },
    { id: 'pg', label: '📝 Pilihan Ganda (10)' },
    { id: 'mcma', label: '☑️ Pilihan Ganda Kompleks (5)' },
    { id: 'tf', label: '✔️ True or False (5)' }
  ];
  tabs.forEach(function(t) {
    const el = document.createElement('div');
    el.className = 'sub-nav-tab' + (currentSubTab === t.id ? ' active' : '');
    el.innerText = t.label;
    el.onclick = function() {
      currentSubTab = t.id;
      document.querySelectorAll('.sub-nav-tab').forEach(x => x.classList.remove('active'));
      el.classList.add('active');
      renderTab();
    };
    sub.appendChild(el);
  });
}

async function loadSheet(sheetName) {
  currentSheet = sheetName;
  currentSubTab = 'materi';
  currentAnalysisNum = 1;
  speechStop();
  document.getElementById('mainContent').innerHTML = '<div class="card"><p style="text-align:center">⏳ Memuat data...</p></div>';
  
  const data = await callGas('getSheetData', { sheetName, studentName: activeUser.nama });
  
  if (!data || data.success === false || !data.materi) { 
    document.getElementById('mainContent').innerHTML = '<div class="card"><p style="color:red; text-align:center; font-weight:bold">❌ Gagal memuat data.</p><p style="font-size:0.9rem; text-align:center; color:#666">' + (data && data.message ? data.message : 'Coba refresh halaman.') + '</p></div>'; 
    return; 
  }
  
  currentSheetData = data;
  pgLocalAnswers = {}; mcmaLocalAnswers = {}; tfLocalAnswers = {};
  buildSubNav();
  renderTab();
}

function renderTab() {
  const c = document.getElementById('mainContent'); c.innerHTML = '';
  if (currentSubTab === 'materi') renderMateri(c);
  else if (currentSubTab === 'analisis') renderAnalisis(c);
  else if (currentSubTab === 'pg') renderPG(c);
  else if (currentSubTab === 'mcma') renderMCMA(c);
  else if (currentSubTab === 'tf') renderTF(c);
}

function renderParaOrMedia(text) {
  const t = text.trim(); if (!t) return null;
  const isUrl = /^(https?:\/\/[^\s]+)$/i.test(t);
  if (isUrl) {
    const w = document.createElement('div');
    const yt = t.match(/(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/i);
    if (yt) { w.innerHTML = `<iframe src="https://www.youtube.com/embed/${yt[1]}" allowfullscreen style="width:100%;height:380px;border:none;border-radius:10px"></iframe>`; return w; }
    const dm = t.match(/\/d\/([a-zA-Z0-9_-]+)/i) || t.match(/id=([a-zA-Z0-9_-]+)/i);
    if (dm) { w.innerHTML = `<iframe src="https://drive.google.com/file/d/${dm[1]}/preview" allow="autoplay" style="width:100%;height:380px;border:none;border-radius:10px"></iframe>`; return w; }
  }
  const p = document.createElement('div'); p.className = 'fmt-p'; p.innerText = text; return p;
}

// ================= TAMPILAN MATERI DIPERBARUI =================
function renderMateri(c) {
  const container = document.createElement('div');
  container.className = 'card';
  
  const data = currentSheetData.materi;

  // 1. Teks Inggris
  if (data.materiEn) {
    const titleEn = document.createElement('h3');
    titleEn.innerText = "📖 Teks Deskripsi (English)";
    titleEn.style.color = 'var(--primary)';
    titleEn.style.marginTop = '0';
    container.appendChild(titleEn);

    const enParas = (data.materiEn || '').split(/\n+/).filter(p => p.trim());
    enParas.forEach(function(para) {
      const el = renderParaOrMedia(para); 
      if (el) container.appendChild(el);
    });

    // Audio Teks Inggris
    const acEn = document.createElement('div'); acEn.className = 'audio-ctrl';
    const bEn = document.createElement('button'); bEn.className = 'btn-audio btn-play-en'; bEn.innerHTML = '▶ Play Audio EN';
    bEn.onclick = function() { playText(data.materiEn, 'en-US', 0.75); };
    const sEn = document.createElement('button'); sEn.className = 'btn-audio btn-stop'; sEn.innerHTML = '⏹ Stop'; sEn.onclick = speechStop;
    acEn.appendChild(bEn); acEn.appendChild(sEn);
    container.appendChild(acEn);
  }

  // 2. Cara Pengucapan
  if (data.materiPronounce) {
    const titlePron = document.createElement('h3');
    titlePron.innerText = "🔊 Cara Pengucapan";
    titlePron.style.color = 'var(--secondary)';
    titlePron.style.marginTop = '30px';
    container.appendChild(titlePron);

    const pPron = document.createElement('div');
    pPron.className = 'pron-block';
    pPron.innerText = data.materiPronounce;
    container.appendChild(pPron);
    // TIDAK ADA AUDIO UNTUK CARA PENGUCAPAN
  }

  // 3. Terjemahan Bahasa Indonesia
  if (data.materiId) {
    const titleId = document.createElement('h3');
    titleId.innerText = "🌐 Terjemahan Bahasa Indonesia";
    titleId.style.color = 'var(--success)';
    titleId.style.marginTop = '30px';
    container.appendChild(titleId);

    const pId = document.createElement('div');
    pId.className = 'trans-block';
    pId.innerText = data.materiId;
    container.appendChild(pId);

    // Audio Teks Indonesia
    const acId = document.createElement('div'); acId.className = 'audio-ctrl';
    const bId = document.createElement('button'); bId.className = 'btn-audio btn-play-id'; bId.innerHTML = '▶ Play Audio ID';
    bId.onclick = function() { playText(data.materiId, 'id-ID', 0.85); };
    const sId = document.createElement('button'); sId.className = 'btn-audio btn-stop'; sId.innerHTML = '⏹ Stop'; sId.onclick = speechStop;

function checkBrowser() {
  if (!(window.SpeechRecognition || window.webkitSpeechRecognition)) { alert('Browser tidak mendukung Web Speech API. Gunakan Chrome/Edge terbaru.'); return false; }
  if (!window.MediaRecorder) { alert('Browser tidak mendukung MediaRecorder. Gunakan Chrome/Edge.'); return false; }
  return true;
}

function startRec(num) {
  if (!checkBrowser()) return;
  finalTranscript = ''; audioChunks = []; isRecording = true; recordStartTime = Date.now();
  document.getElementById('recStatus' + num).innerText = '🔴 SEDANG MEREKAM... Bacalah dengan lantang!';
  document.getElementById('recStatus' + num).className = 'rec-status recording';
  document.getElementById('btnRec' + num).innerText = '⏹ SELESAI REKAM';
  document.getElementById('btnRec' + num).classList.add('recording');
  document.getElementById('liveBox' + num).style.display = 'block';
  document.getElementById('liveText' + num).innerText = 'Mulai bicara...';
  navigator.mediaDevices.getUserMedia({ audio: true }).then(function(stream) {
    mediaRecorder = new MediaRecorder(stream);
    mediaRecorder.ondataavailable = function(e) { if (e.data && e.data.size > 0) audioChunks.push(e.data); };
    mediaRecorder.onstop = function() {
      var mime = mediaRecorder.mimeType || 'audio/webm';
      audioBlobGlobal = new Blob(audioChunks, { type: mime });
      var url = URL.createObjectURL(audioBlobGlobal);
      var pb = document.getElementById('audioPb' + num);
      pb.src = url; pb.style.display = 'block';
      stream.getTracks().forEach(function(t) { t.stop(); });
      var r = new FileReader();
      r.onload = function(e) {
        document.getElementById('audioData' + num).value = e.target.result.split(',')[1];
        document.getElementById('audioMime' + num).value = mime;
        document.getElementById('audioDur' + num).value = Math.max(1, Math.round((Date.now() - recordStartTime) / 1000));
        document.getElementById('btnSubmitFinal' + num).disabled = false;
      };
      r.readAsDataURL(audioBlobGlobal);
    };
    mediaRecorder.start();
    var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    recognition = new SR();
    recognition.lang = 'en-US'; recognition.continuous = true; recognition.interimResults = true;
    recognition.onresult = function(ev) {
      var interim = '';
      for (var i = ev.resultIndex; i < ev.results.length; i++) {
        var tp = ev.results[i][0].transcript;
        if (ev.results[i].isFinal) finalTranscript += ' ' + tp; else interim += tp;
      }
      var d = (finalTranscript + ' ' + interim).trim();
      if (d) { var box = document.getElementById('liveText' + num); box.innerText = d; box.style.color = '#0c4a6e'; box.style.fontStyle = 'normal'; }
    };
    recognition.onend = function() { if (isRecording) { try { recognition.start(); } catch(e){} } };
    try { recognition.start(); } catch(e){}
  }).catch(function(err) {
    alert('Tidak bisa akses mikrofon: ' + err.message);
    isRecording = false;
    document.getElementById('btnRec' + num).innerText = '🎙️ MULAI REKAM';
    document.getElementById('btnRec' + num).classList.remove('recording');
    document.getElementById('recStatus' + num).innerText = 'Gagal mengakses mikrofon.';
    document.getElementById('recStatus' + num).className = 'rec-status';
  });
}

function stopRec(num) {
  if (!isRecording) return;
  isRecording = false;
  if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
  if (recognition) { try { recognition.stop(); } catch(e){} }
  document.getElementById('recStatus' + num).innerText = '✅ Rekaman selesai. Dengarkan audio, lalu klik Kirim.';
  document.getElementById('recStatus' + num).className = 'rec-status done';
  document.getElementById('btnRec' + num).innerText = '🎙️ REKAM ULANG';
  document.getElementById('btnRec' + num).classList.remove('recording');
  document.getElementById('speechTrans' + num).value = (finalTranscript || '').trim();
}

function toggleRecording(num) { if (isRecording) stopRec(num); else startRec(num); }

        if (ev.results[i].isFinal) finalTransReup += ' ' + tp; else interim += tp;

async function submitFinal(num, isReup) {
  isReup = isReup || false;
  const btn = document.getElementById(isReup ? 'btnSubmitReup' + num : 'btnSubmitFinal' + num);
  const err = document.getElementById('ansError' + num);
  const audioData = document.getElementById(isReup ? 'audioDataReup' + num : 'audioData' + num).value;
  const dur = document.getElementById(isReup ? 'audioDurReup' + num : 'audioDur' + num).value;
  const trans = document.getElementById(isReup ? 'speechTransReup' + num : 'speechTrans' + num).value || '';
  if (!audioData) { err.innerText = 'Rekam suara terlebih dahulu!'; err.style.display = 'block'; return; }
  btn.disabled = true; btn.innerHTML = '⏳ Mengunggah & Menganalisis...'; err.style.display = 'none';
  const fname = activeUser.nama + '_A' + num + (isReup ? '_REUP_' : '_') + Date.now() + '.webm';
  const mime = document.getElementById(isReup ? 'audioMimeReup' + num : 'audioMime' + num).value || 'audio/webm';
  const up = await callGas('uploadAudioToDrive', { base64Data: audioData, fileName: fname, mimeType: mime });
  if (!up.success) {
    btn.disabled = false; btn.innerHTML = isReup ? '🔄 Kirim Ulang Audio' : '✅ Kirim Jawaban';
    err.innerText = 'Gagal unggah audio: ' + up.message; err.style.display = 'block';
    return;
  }
  const res = await callGas('submitStudentAnswer', {
    sheetName: currentSheet, studentName: activeUser.nama, questionNum: num,
    jawabanText: submittedAnswerText, audioUrl: up.url, recordingDuration: dur || "0",
    originalEnglishText: originalEnglishText, fileName: fname, isReupload: isReup,
    fileSizeBytes: up.sizeBytes, speechTranscript: trans
  });
  btn.disabled = false; btn.innerHTML = isReup ? '🔄 Kirim Ulang Audio' : '✅ Kirim Jawaban';
  if (res.success) {
    const subData = { jawabanId: submittedAnswerText, jawabanEn: res.jawabanEn, jawabanPronounce: res.jawabanPronounce, audioUrl: up.downloadUrl, transkrip: res.speechTranscript || res.jawabanEn, penilaianAI: res.speakingAssessment, akurasi: res.similarityScore + '%', feedbackEn: res.feedbackEn, feedbackPronounce: res.feedbackPronounce, feedbackId: res.feedbackId, category: res.category, requiresReupload: res.requiresReupload, rerecordMessage: res.rerecordMessage };
    if (!currentSheetData.submissions) currentSheetData.submissions = {};
    currentSheetData.submissions[num] = subData;
    renderTab();
    if (res.requiresReupload && !isReup) alert('⚠️ PERHATIAN: ' + res.rerecordMessage);
    else if (!res.requiresReupload) alert('✅ Kerja bagus! Audio sesuai.');
  } else { err.innerText = res.message; err.style.display = 'block'; }
}

function renderPG(c) {
  if (!currentSheetData.pg || !currentSheetData.pg.length) { c.innerHTML = '<div class="card"><p>Tidak ada data PG.</p></div>'; return; }
  const w = document.createElement('div');
  const header = document.createElement('div'); header.className = 'quiz-header';
  const score = currentSheetData.pgSubmissions && currentSheetData.pgSubmissions._score !== undefined ? currentSheetData.pgSubmissions._score : 0;
  header.innerHTML = '<h3>📝 Pilihan Ganda (10 Soal)</h3><p>Pilih satu jawaban yang paling tepat. Setelah dipilih, jawaban tidak bisa diubah.</p><p style="margin-top:10px"><strong>Skor Anda: ' + score + ' / 10</strong><span class="score-badge">Pilihan Ganda</span></p>';
  w.appendChild(header);
  currentSheetData.pg.forEach(function(q) {
    const card = document.createElement('div'); card.className = 'quiz-card'; card.id = 'pgCard' + q.num;
    card.innerHTML = '<div class="quiz-q-text">' + q.num + '. ' + (q.questionEn || '').replace(/\n/g, '<br>') + '</div>';
    const ac = document.createElement('div'); ac.className = 'audio-ctrl';
    if (q.questionPronounce) {
      const bp = document.createElement('button'); bp.className = 'btn-audio btn-play-en'; bp.innerHTML = '▶ Pronounce';
      bp.onclick = function() { playText(q.questionPronounce, 'en-US', 0.75); };
      const bs = document.createElement('button'); bs.className = 'btn-audio btn-stop'; bs.innerHTML = '⏹ Stop'; bs.onclick = speechStop;
      ac.appendChild(bp); ac.appendChild(bs);
    }
    if (q.questionId) {
      const bi = document.createElement('button'); bi.className = 'btn-audio btn-play-id'; bi.innerHTML = '▶ Terjemahan';
      bi.onclick = function() { playText(q.questionId, 'id-ID', 0.85); };
      ac.appendChild(bi);
    }
    if (ac.children.length) card.appendChild(ac);
    if (q.questionPronounce) { const p = document.createElement('div'); p.className = 'pron-block'; p.innerText = q.questionPronounce; card.appendChild(p); }
    if (q.questionId) { const t = document.createElement('div'); t.className = 'trans-block'; t.innerText = q.questionId; card.appendChild(t); }
    const optText = (q.questionEn || '');
    const lines = optText.split(/\n/).map(s => s.trim()).filter(s => s);
    const opts = [];
    lines.forEach(function(ln) {
      const m = ln.match(/^([A-E])[\.\)]\s*(.+)$/);
      if (m) opts.push({ letter: m[1], text: m[2] });
    });
    const existing = currentSheetData.pgSubmissions && currentSheetData.pgSubmissions[q.num] ? String(currentSheetData.pgSubmissions[q.num].jawaban) : '';
    const localSel = pgLocalAnswers[q.num] || existing || '';
    if (opts.length > 0) {
      const optWrap = document.createElement('div');
      opts.forEach(function(o) {
        const btn = document.createElement('button');
        btn.type = 'button'; btn.className = 'quiz-opt'; btn.dataset.qnum = q.num; btn.dataset.letter = o.letter;
        btn.innerText = o.letter + '. ' + o.text;
        if (existing) {
          btn.disabled = true;
          if (o.letter === existing) btn.classList.add('selected');
          if (o.letter === q.correctAnswer && existing === q.correctAnswer) btn.classList.add('correct-opt');
          if (o.letter === existing && existing !== q.correctAnswer) btn.classList.add('wrong-opt');
        } else if (localSel === o.letter) btn.classList.add('selected');
        btn.onclick = function() { selectPG(q.num, o.letter); };
        optWrap.appendChild(btn);
      });
      card.appendChild(optWrap);
    }
    if (existing) {
      const fb = document.createElement('div');
      fb.className = 'quiz-feedback ' + (existing === q.correctAnswer ? 'correct' : 'wrong');
      let html = '<strong>' + (existing === q.correctAnswer ? '✅ Benar!' : '❌ Belum tepat.') + '</strong>';
      html += ' Jawaban benar: <strong>' + q.correctAnswer + '</strong>.<br><br>';
      if (q.feedbackEn) html += '<div style="margin-top:8px">' + q.feedbackEn + '</div>';
      fb.innerHTML = html;
      card.appendChild(fb);
      if (existing === q.correctAnswer) card.classList.add('correct'); else card.classList.add('wrong');
    }
    w.appendChild(card);
  });
  c.appendChild(w);
}

function selectPG(num, letter) {
  if (currentSheetData.pgSubmissions && currentSheetData.pgSubmissions[num]) return;
  pgLocalAnswers[num] = letter;
  submitQuiz('pg', num, letter);
}

async function submitQuiz(type, num, answer) {
  const res = await callGas('submitQuizAnswer', { sheetName: currentSheet, studentName: activeUser.nama, quizType: type, questionNum: num, studentAnswer: answer });
  if (res.success) {
    if (type === 'pg') { if (!currentSheetData.pgSubmissions) currentSheetData.pgSubmissions = {}; currentSheetData.pgSubmissions[num] = { jawaban: answer }; currentSheetData.pgSubmissions._score = res.totalScore; }
    else if (type === 'mcma') { if (!currentSheetData.mcmaSubmissions) currentSheetData.mcmaSubmissions = {}; currentSheetData.mcmaSubmissions[num] = { jawaban: answer }; currentSheetData.mcmaSubmissions._score = res.totalScore; }
    else if (type === 'tf') { if (!currentSheetData.tfSubmissions) currentSheetData.tfSubmissions = {}; currentSheetData.tfSubmissions[num] = { jawaban: answer }; currentSheetData.tfSubmissions._score = res.totalScore; }
    renderTab();
  } else {
    alert('Gagal submit: ' + res.message);
  }
}

      ac.appendChild(bp); ac.appendChild(bs);

    if (q.questionPronounce) { const p = document.createElement('div'); p.className = 'pron-block'; p.innerText = q.questionPronounce; card.appendChild(p); }
    if (q.questionId) { const t = document.createElement('div'); t.className = 'trans-block'; t.innerText = q.questionId; card.appendChild(t); }
    const optText = (q.questionEn || '');
    const lines = optText.split(/\n/).map(s => s.trim()).filter(s => s);
    const opts = [];
    lines.forEach(function(ln) {
      const m = ln.match(/^([A-E])[\.\)]\s*(.+)$/);
      if (m) opts.push({ letter: m[1], text: m[2] });
    });
    const existing = currentSheetData.mcmaSubmissions && currentSheetData.mcmaSubmissions[q.num] ? String(currentSheetData.mcmaSubmissions[q.num].jawaban) : '';
    const existingArr = existing ? existing.split(',').map(x => x.trim()).filter(x => x) : [];
    const localSel = mcmaLocalAnswers[q.num] || existingArr;
    if (opts.length > 0) {
      const optWrap = document.createElement('div');
      opts.forEach(function(o) {
        const btn = document.createElement('button');
        btn.type = 'button'; btn.className = 'quiz-opt'; btn.dataset.qnum = q.num; btn.dataset.letter = o.letter;
        btn.innerText = o.letter + '. ' + o.text;
        if (existing) {
          btn.disabled = true;
          const isSel = existingArr.indexOf(o.letter) !== -1;
          const isCorr = Array.isArray(q.correctAnswer) && q.correctAnswer.indexOf(o.letter) !== -1;
          if (isSel && isCorr) btn.classList.add('correct-opt');
          else if (isSel && !isCorr) btn.classList.add('wrong-opt');
          else if (!isSel && isCorr) btn.classList.add('correct-opt');

          submitQuiz('mcma', q.num, arr.sort().join(','));
        };
        card.appendChild(submitBtn);
      }
    }
    if (existing) {
      const isCorrect = Array.isArray(q.correctAnswer) ? q.correctAnswer.slice().sort().join(',') === existingArr.slice().sort().join(',') : false;

      if (q.feedbackEn) html += '<div style="margin-top:8px">' + q.feedbackEn + '</div>';
      fb.innerHTML = html;
      card.appendChild(fb);
      if (isCorrect) card.classList.add('correct'); else card.classList.add('wrong');
    }
    w.appendChild(card);
  });
  c.appendChild(w);
}

function toggleMCMA(num, letter) {
  if (currentSheetData.mcmaSubmissions && currentSheetData.mcmaSubmissions[num]) return;
  if (!mcmaLocalAnswers[num]) mcmaLocalAnswers[num] = [];
  const arr = mcmaLocalAnswers[num];
  const idx = arr.indexOf(letter);
  if (idx === -1) arr.push(letter); else arr.splice(idx, 1);
  renderTab();
}

function playText(text, lang, rate) {
  speechStop();
  if (!text || !text.trim()) return;
  if (!availableVoices.length) loadVoices();
  const u = new SpeechSynthesisUtterance(text.trim());
  u.rate = rate || 0.85;
  u.lang = lang;
  const v = lang === 'id-ID' ? getIDVoice() : getENVoice();
  if (v) { u.voice = v; u.pitch = 1; u.volume = 1; }
  window.speechSynthesis.speak(u);
}

function playFeedbackEN(text, name) {
  speechStop();
  if (!availableVoices.length) loadVoices();
  const prefix = 'Excellent work, ' + name + '! ';
  let rest = text;
  const idx = text.indexOf(prefix);
  if (idx === 0) rest = text.substring(prefix.length);
  if (rest !== text) {
    const u1 = new SpeechSynthesisUtterance(prefix);
    u1.rate = 0.85; u1.lang = 'id-ID';
    const idV = getIDVoice(); if (idV) u1.voice = idV;
    const u2 = new SpeechSynthesisUtterance(rest);
    u2.rate = 0.75; u2.lang = 'en-US';
    const enV = getENVoice(); if (enV) u2.voice = enV;
    u1.onend = function() { window.speechSynthesis.speak(u2); };
    window.speechSynthesis.speak(u1);
  } else { playText(text, 'en-US', 0.75); }
}
function playFeedbackID(text) { playText(text, 'id-ID', 0.85); }
function speechStop() { window.speechSynthesis.cancel(); }

function openAudioModal() {
  const modal = document.getElementById('audioModal');
  const fr = document.getElementById('driveAudioFrame');
  if (currentAudioUrl) {
    let fid = '';
    let m = currentAudioUrl.match(/\/d\/([a-zA-Z0-9_-]+)/);
    if (m) fid = m[1]; else { m = currentAudioUrl.match(/id=([a-zA-Z0-9_-]+)/); if (m) fid = m[1]; }
    if (fid) { fr.src = 'https://drive.google.com/file/d/' + fid + '/preview'; modal.classList.add('active'); }
  }
}
function closeAudioModal() { document.getElementById('audioModal').classList.remove('active'); document.getElementById('driveAudioFrame').src = ''; }
function closeAudioModalOnOverlay(e) { if (e.target === e.currentTarget) closeAudioModal(); }
document.addEventListener('keydown', function(e) { if (e.key === 'Escape') closeAudioModal(); });
