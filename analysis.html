<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lopo Pelajar - Analisis Descriptive Text HOTS</title>
  <style>
    :root { --primary: #1b365d; --secondary: #0066cc; --accent: #d97706; --danger: #dc2626; --success: #16a34a; --bg: #f8fafc; --card-bg: #ffffff; --text: #1e293b; }
    body { font-family: 'Segoe UI', System-UI, sans-serif; line-height: 1.6; color: var(--text); background-color: var(--bg); margin: 0; padding: 0; }
    .header-banner { background-color: var(--primary); color: white; padding: 20px; text-align: center; }
    .container { max-width: 900px; margin: 20px auto; padding: 0 20px; }
    .card { background: var(--card-bg); padding: 20px; margin-bottom: 15px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); border: 1px solid #e2e8f0; }
    
    /* Accordion Styles */
    .accordion-item { border: 1px solid #e2e8f0; border-radius: 8px; margin-bottom: 10px; overflow: hidden; }
    .accordion-header { background: #f1f5f9; padding: 15px 20px; cursor: pointer; font-weight: 600; display: flex; justify-content: space-between; align-items: center; transition: background 0.2s; }
    .accordion-header:hover { background: #e2e8f0; }
    .accordion-header.active { background: var(--secondary); color: white; }
    .accordion-content { display: none; padding: 20px; background: white; border-top: 1px solid #e2e8f0; }
    .accordion-content.show { display: block; }
    
    /* Form & Recorder Elements */
    textarea { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; min-height: 120px; font-family: inherit; margin-bottom: 10px; box-sizing: border-box; }
    .btn { padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; color: white; transition: 0.2s; display: inline-flex; align-items: center; gap: 8px; }
    .btn-primary { background-color: var(--secondary); }
    .btn-success { background-color: var(--success); }
    .btn-danger { background-color: var(--danger); }
    .btn:disabled { background-color: #cbd5e1; cursor: not-allowed; }
    
    .recorder-box { background: #fff7ed; padding: 20px; border-radius: 8px; border: 1px solid #fdba74; margin-top: 15px; }
    .btn-record { background: var(--danger); color: white; border: none; padding: 12px 24px; border-radius: 50px; font-size: 1rem; font-weight: bold; cursor: pointer; display: inline-flex; align-items: center; gap: 10px; box-shadow: 0 4px 12px rgba(220,38,38,0.3); transition: all 0.2s; }
    .btn-record:hover { transform: scale(1.03); }
    .btn-record.recording { background: #991b1b; animation: pulseRec 1s infinite; }
    @keyframes pulseRec { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
    
    .live-transcript-box { background: #f0f9ff; border-left: 4px solid var(--secondary); padding: 12px 16px; margin-top: 15px; border-radius: 4px; min-height: 50px; font-size: 0.95rem; color: #0c4a6e; line-height: 1.6; display: none; }
    .recorder-status { font-size: 0.9rem; margin-top: 10px; color: #7c2d12; font-weight: 600; text-align: center; }
    .recorder-status.recording { color: var(--danger); }
    
    .feedback-box { background: #f0fdf4; border-left: 4px solid var(--success); padding: 15px; border-radius: 8px; margin-top: 15px; display: none; }
    .pronounce-block { background-color: #f0f9ff; border-left: 4px solid var(--secondary); padding: 12px; color: #0369a1; font-style: italic; border-radius: 4px; margin: 10px 0; }
    .translation-block { background-color: #f0fdf4; border-left: 4px solid var(--success); padding: 12px; color: #15803d; border-radius: 4px; margin: 10px 0; }

    /* MCMA & TF Styles */
    .option-group { margin: 10px 0; padding: 10px; border: 1px solid #e2e8f0; border-radius: 8px; cursor: pointer; transition: 0.2s; }
    .option-group:hover { background: #f8fafc; border-color: var(--secondary); }
    .option-group input { margin-right: 10px; transform: scale(1.2); }
  </style>
</head>
<body>

<div class="header-banner">
  <h1>Interactive English Learning Platform</h1>
  <h2 id="sheetTitleDisplay">Descriptive Text Analysis (HOTS)</h2>
  <p id="userDisplay" style="font-size: 0.9rem; opacity: 0.9;"></p>
</div>

<div id="login-container" class="container">
  <div class="card" style="max-width: 400px; margin: 40px auto;">
    <h2 style="text-align: center; color: var(--primary);">Masuk Portal Siswa</h2>
    <input type="text" id="inputNama" placeholder="Nama Lengkap" style="width: 100%; padding: 12px; margin-bottom: 10px; border: 1px solid #cbd5e1; border-radius: 8px; box-sizing: border-box;">
    <input type="password" id="inputPass" placeholder="Password" style="width: 100%; padding: 12px; margin-bottom: 10px; border: 1px solid #cbd5e1; border-radius: 8px; box-sizing: border-box;">
    <input type="text" id="inputKelas" placeholder="Kelas (Contoh: 7A)" style="width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #cbd5e1; border-radius: 8px; box-sizing: border-box;">
    <button class="btn btn-primary" style="width: 100%; justify-content: center;" onclick="executeLogin()">Enter / Masuk</button>
    <p id="loginError" style="color: var(--danger); text-align: center; margin-top: 10px; display: none;"></p>
  </div>
</div>

<div id="main-app" style="display: none;" class="container">
  <!-- Navigasi Sheet -->
  <div id="navTabs" style="display: flex; gap: 10px; overflow-x: auto; padding-bottom: 15px; margin-bottom: 20px;"></div>

  <!-- MATERI UTAMA (PASTI MUNCUL PALING ATAS & MENONJOL) -->
  <div class="card" style="border-left: 5px solid var(--primary);">
    <h2 style="color: var(--primary); margin-top: 0;">📖 Materi Utama: Reading Text</h2>
    <div id="materi-content">
      <p style="color: #64748b;">Memuat materi...</p>
    </div>
  </div>

  <!-- Accordion Container untuk Semua Pertanyaan -->
  <div id="accordion-container"></div>
</div>

<script>
  // ⚠️ GANTI URL INI DENGAN URL WEB APP GOOGLE APPS SCRIPT ANDA
  const GAS_API_URL = 'https://script.google.com/macros/s/AKfycbww_eDl2hXqE44UQe7A1wRR19dtiFW3gLp-lWg1Te7URmLSb8yrfGrx3nAdQv7GsLLDGw/exec';

  let activeUser = { nama: '', kelas: '' };
  let currentSheet = '';
  let sheetData = null;

  // Variabel Global untuk Recorder
  let mediaRecorder = null;
  let audioChunks = [];
  let recognition = null;
  let finalTranscript = '';
  let isRecording = false;
  let currentActiveBlockId = null;

  async function callGas(action, payload) {
    try {
      const res = await fetch(GAS_API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: action, payload: payload })
      });
      return await res.json();
    } catch (err) {
      return { success: false, message: 'Koneksi gagal: ' + err.message };
    }
  }

  async function executeLogin() {
    const nama = document.getElementById('inputNama').value;
    const pass = document.getElementById('inputPass').value;
    const kelas = document.getElementById('inputKelas').value;
    if (!nama || !pass) { alert('Nama dan Password wajib diisi!'); return; }

    const btn = event.target;
    btn.disabled = true; btn.innerText = 'Memproses...';
    
    const res = await callGas('login', { nama: nama, password: pass, kelas: kelas });
    btn.disabled = false; btn.innerText = 'Enter / Masuk';

    if (res.success) {
      activeUser = { nama: res.nama, kelas: res.kelas };
      document.getElementById('login-container').style.display = 'none';
      document.getElementById('main-app').style.display = 'block';
      document.getElementById('userDisplay').innerText = `Siswa: ${activeUser.nama} | Kelas: ${activeUser.kelas}`;
      buildNavTabs(res.availableSheets);
    } else {
      document.getElementById('loginError').innerText = res.message;
      document.getElementById('loginError').style.display = 'block';
    }
  }

  function buildNavTabs(sheets) {
    const nav = document.getElementById('navTabs');
    nav.innerHTML = '';
    sheets.forEach((sheetName, index) => {
      const btn = document.createElement('button');
      btn.className = 'btn';
      btn.style.backgroundColor = index === 0 ? 'var(--secondary)' : '#e2e8f0';
      btn.style.color = index === 0 ? 'white' : 'var(--text)';
      btn.innerText = sheetName;
      btn.onclick = () => loadSheet(sheetName, btn);
      nav.appendChild(btn);
    });
    if (sheets.length > 0) loadSheet(sheets[0], nav.firstChild);
  }

  async function loadSheet(sheetName, btnElement) {
    currentSheet = sheetName;
    document.getElementById('sheetTitleDisplay').innerText = sheetName;
    
    const buttons = document.getElementById('navTabs').querySelectorAll('button');
    buttons.forEach(b => { b.style.backgroundColor = '#e2e8f0'; b.style.color = 'var(--text)'; });
    btnElement.style.backgroundColor = 'var(--secondary)';
    btnElement.style.color = 'white';

    const res = await callGas('getSheetData', { sheetName: sheetName, studentName: activeUser.nama });
    if (!res.success) { alert(res.message); return; }
    
    sheetData = res;
    renderMateri(res.materi);
    renderAccordion(res);
  }

  function renderMateri(materi) {
    // PASTIKAN MATERI MUNCUL DENGAN JELAS
    document.getElementById('materi-content').innerHTML = `
      <div class="pronounce-block" style="font-size: 1.1rem; line-height: 1.8;">${materi.pronounce || ''}</div>
      <div style="font-size: 1.1rem; line-height: 1.8; margin-bottom: 15px; white-space: pre-wrap;">${materi.en}</div>
      <div class="translation-block" style="font-size: 1.05rem; line-height: 1.6;">${materi.id}</div>
    `;
  }

  function renderAccordion(data) {
    const container = document.getElementById('accordion-container');
    container.innerHTML = '';

    // 1. 10 Blok Analisis Mendalam
    if (data.analysisBlocks && data.analysisBlocks.length > 0) {
      createAccordionSection(container, '🔍 10 Analisis Mendalam (Struktur & Grammar)', data.analysisBlocks.map((block, idx) => {
        return createAnalysisBlockHTML(block, idx, data.submissions[block.id]);
      }));
    }

    // 2. 10 Soal HOTS
    if (data.hotsQuestions && data.hotsQuestions.length > 0) {
      createAccordionSection(container, '🧠 10 Soal HOTS (Refleksi & Analisis)', data.hotsQuestions.map((q, idx) => {
        return createHotsBlockHTML(q, idx, data.submissions[q.id]);
      }));
    }

    // 3. 5 Soal MCMA
    if (data.mcma && data.mcma.questions.length > 0) {
      createAccordionSection(container, '✅ 5 Soal Pilihan Ganda Kompleks (MCMA)', data.mcma.questions.map((q, idx) => {
        return createMCMABlockHTML(q, idx, data.submissions[q.id]);
      }));
    }

    // 4. 5 Soal True/False
    if (data.trueFalse && data.trueFalse.questions.length > 0) {
      createAccordionSection(container, '⚖️ 5 Soal True or False', data.trueFalse.questions.map((q, idx) => {
        return createTFBlockHTML(q, idx, data.submissions[q.id]);
      }));
    }
  }

  function createAccordionSection(container, title, itemsHTML) {
    const section = document.createElement('div');
    section.className = 'accordion-item';
    section.innerHTML = `
      <div class="accordion-header" onclick="toggleAccordion(this)">
        <span>${title}</span>
        <span>▼</span>
      </div>
      <div class="accordion-content">
        ${itemsHTML.join('')}
      </div>
    `;
    container.appendChild(section);
  }

  function toggleAccordion(header) {
    if (isRecording) stopRecording(); 
    header.classList.toggle('active');
    const content = header.nextElementSibling;
    content.classList.toggle('show');
  }

  function createAnalysisBlockHTML(block, idx, submission) {
    if (submission && submission.status === 'DITERIMA') {
      return `<div class="card" style="border-left: 4px solid var(--success);">
        <h4>✅ ${idx + 1}. Analisis: ${block.title} (Selesai)</h4>
        <p><strong>Jawaban:</strong> ${submission.jawabanId}</p>
        <p><strong>Akurasi:</strong> ${submission.akurasi}</p>
        <p><strong>Feedback:</strong> ${submission.feedbackId}</p>
      </div>`;
    }
    return `<div class="card" style="border-left: 4px solid var(--secondary);">
      <h4>⭕ ${idx + 1}. Analisis: ${block.title}</h4>
      <details style="margin-bottom: 15px;">
        <summary style="cursor: pointer; color: var(--secondary); font-weight: 600;">Lihat Instruksi & Terjemahan</summary>
        <div class="pronounce-block">${block.instrPron}</div>
        <p>${block.instrEn}</p>
        <div class="translation-block">${block.instrId}</div>
      </details>
      <textarea id="input_${block.id}" placeholder="Tulis jawaban analisis Anda di sini (Bahasa Indonesia)..."></textarea>
      <button class="btn btn-primary" onclick="processAnalysisAnswer('${block.id}', ${block.colJawabId}, ${block.colJawabEn}, ${block.colAudio}, ${block.colTranskrip}, ${block.colAkurasi}, ${block.colFeedbackId})">
        📤 Terjemahkan & Siapkan Rekam
      </button>
      <div id="recorder_area_${block.id}" style="display: none; margin-top: 15px;">
        <div class="recorder-box">
          <p><strong>📖 Bacalah teks ini dengan lantang:</strong></p>
          <p id="en_text_${block.id}" style="background: #fff; padding: 10px; border-radius: 6px; border: 1px solid #e2e8f0;"></p>
          <div style="text-align: center; margin: 20px 0;">
            <button class="btn-record" id="btn_record_${block.id}" onclick="toggleRecording('${block.id}')">🎙️ MULAI REKAM</button>
          </div>
          <p id="record_status_${block.id}" class="recorder-status">Siap merekam. Klik tombol di atas.</p>
          <div id="liveTranscriptBox_${block.id}" class="live-transcript-box">
            <strong>📝 Transkrip Suara Anda (Real-time):</strong>
            <div id="liveTranscriptText_${block.id}" style="color: #64748b; font-style: italic; margin-top: 5px;">Mulai bicara...</div>
          </div>
          <audio id="audioPlayback_${block.id}" controls style="width: 100%; margin-top: 15px; display: none;"></audio>
        </div>
        <button class="btn btn-success" style="width: 100%; margin-top: 15px; justify-content: center;" id="btn_submit_${block.id}" onclick="finalSubmit('${block.id}', 'analysis')" disabled>
          ✅ Kirim Jawaban & Penilaian ke Guru
        </button>
      </div>
    </div>`;
  }

  function createHotsBlockHTML(q, idx, submission) {
    if (submission && submission.status === 'DITERIMA') {
      return `<div class="card" style="border-left: 4px solid var(--success);">
        <h4>✅ Soal HOTS ${q.num} (Selesai)</h4>
        <p><strong>Soal:</strong> ${q.soalEn}</p>
        <p><strong>Jawaban:</strong> ${submission.jawabanId}</p>
      </div>`;
    }
    return `<div class="card" style="border-left: 4px solid var(--accent);">
      <h4>⭕ Soal HOTS ${q.num}</h4>
      <p><strong>${q.soalEn}</strong></p>
      <div class="translation-block">${q.soalId}</div>
      <textarea id="input_${q.id}" placeholder="Tulis jawaban refleksi Anda di sini..."></textarea>
      <button class="btn btn-primary" onclick="processAnalysisAnswer('${q.id}', ${q.colFeedbackId - 2}, ${q.colFeedbackId - 1}, ${q.colFeedbackId + 2}, ${q.colFeedbackId + 3}, ${q.colFeedbackId + 5}, ${q.colFeedbackId})">
        📤 Terjemahkan & Siapkan Rekam
      </button>
      <div id="recorder_area_${q.id}" style="display: none; margin-top: 15px;">
        <div class="recorder-box">
          <p id="en_text_${q.id}" style="background: #fff; padding: 10px; border-radius: 6px; border: 1px solid #e2e8f0;"></p>
          <div style="text-align: center; margin: 20px 0;">
            <button class="btn-record" id="btn_record_${q.id}" onclick="toggleRecording('${q.id}')">🎙️ MULAI REKAM</button>
          </div>
          <p id="record_status_${q.id}" class="recorder-status">Siap merekam.</p>
          <div id="liveTranscriptBox_${q.id}" class="live-transcript-box">
            <div id="liveTranscriptText_${q.id}">Mulai bicara...</div>
          </div>
          <audio id="audioPlayback_${q.id}" controls style="width: 100%; margin-top: 15px; display: none;"></audio>
        </div>
        <button class="btn btn-success" style="width: 100%; margin-top: 15px; justify-content: center;" id="btn_submit_${q.id}" onclick="finalSubmit('${q.id}', 'hots')" disabled>
          ✅ Kirim Jawaban
        </button>
      </div>
    </div>`;
  }

  function createMCMABlockHTML(q, idx, submission) {
    return `<div class="card" style="border-left: 4px solid #8b5cf6;">
      <h4>⭕ MCMA ${q.num}: Pilih LEBIH DARI SATU jawaban yang benar</h4>
      <p><strong>${q.soalEn}</strong></p>
      <div class="translation-block">${q.soalId}</div>
      <div id="mcma_options_${q.id}">
        ${['A', 'B', 'C', 'D', 'E'].map(opt => `
          <label class="option-group">
            <input type="checkbox" name="mcma_${q.id}" value="${opt}"> Opsi ${opt}
          </label>
        `).join('')}
      </div>
      <button class="btn btn-primary" style="margin-top: 10px;" onclick="submitMCMA('${q.id}', ${q.colFeedbackId})">Kirim Jawaban</button>
      ${submission ? `<div class="feedback-box" style="display:block;"><strong>Feedback:</strong><br>${submission.feedbackId || 'Jawaban tersimpan.'}</div>` : ''}
    </div>`;
  }

  function createTFBlockHTML(q, idx, submission) {
    return `<div class="card" style="border-left: 4px solid #ec4899;">
      <h4>⭕ True or False ${q.num}</h4>
      <p><strong>${q.statementEn}</strong></p>
      <div class="translation-block">${q.statementId}</div>
      <div style="display: flex; gap: 20px; margin: 15px 0;">
        <label style="cursor: pointer;"><input type="radio" name="tf_${q.id}" value="TRUE"> TRUE (Benar)</label>
        <label style="cursor: pointer;"><input type="radio" name="tf_${q.id}" value="FALSE"> FALSE (Salah)</label>
      </div>
      <button class="btn btn-primary" onclick="submitTF('${q.id}', '${q.answerKey}', ${q.colFeedbackId})">Kirim Jawaban</button>
      ${submission ? `<div class="feedback-box" style="display:block;"><strong>Feedback:</strong><br>${submission.feedbackId || 'Jawaban tersimpan.'}</div>` : ''}
    </div>`;
  }

  // ==========================================
  // LOGIKA TRANSLASI & REKAMAN SUARA
  // ==========================================
  async function processAnalysisAnswer(blockId, colJawabId, colJawabEn, colAudio, colTranskrip, colAkurasi, colFeedbackId) {
    const text = document.getElementById(`input_${blockId}`).value;
    if (text.length < 20) { alert('Jawaban terlalu pendek! Minimal jelaskan dengan 1-2 kalimat.'); return; }
    
    const res = await callGas('getInstantTranslation', { text: text });
    if (res.success) {
      document.getElementById(`en_text_${blockId}`).innerText = res.jawabanEn;
      document.getElementById(`recorder_area_${blockId}`).style.display = 'block';
      
      const el = document.getElementById(`recorder_area_${blockId}`);
      el.dataset.colJawabId = colJawabId;
      el.dataset.colJawabEn = colJawabEn;
      el.dataset.colAudio = colAudio;
      el.dataset.colTranskrip = colTranskrip;
      el.dataset.colAkurasi = colAkurasi;
      el.dataset.colFeedbackId = colFeedbackId;
      
      document.getElementById(`recorder_area_${blockId}`).scrollIntoView({ behavior: 'smooth' });
    } else {
      alert('Gagal menerjemahkan: ' + res.message);
    }
  }

  function toggleRecording(blockId) {
    if (isRecording) {
      stopRecording();
    } else {
      startRecording(blockId);
    }
  }

  function startRecording(blockId) {
    currentActiveBlockId = blockId;
    finalTranscript = '';
    audioChunks = [];
    isRecording = true;

    const btn = document.getElementById(`btn_record_${blockId}`);
    const status = document.getElementById(`record_status_${blockId}`);
    const transcriptBox = document.getElementById(`liveTranscriptBox_${blockId}`);
    const transcriptText = document.getElementById(`liveTranscriptText_${blockId}`);

    btn.innerText = '⏹ SELESAI REKAM';
    btn.classList.add('recording');
    status.innerText = '🔴 SEDANG MEREKAM... Bacalah teks Bahasa Inggris di atas!';
    status.classList.add('recording');
    transcriptBox.style.display = 'block';

    navigator.mediaDevices.getUserMedia({ audio: true }).then(function(stream) {
      mediaRecorder = new MediaRecorder(stream);
      mediaRecorder.ondataavailable = function(e) {
        if (e.data && e.data.size > 0) audioChunks.push(e.data);
      };
      mediaRecorder.onstop = function() {
        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
        const url = URL.createObjectURL(audioBlob);
        const playback = document.getElementById(`audioPlayback_${blockId}`);
        playback.src = url;
        playback.style.display = 'block';
        
        const reader = new FileReader();
        reader.onload = function(e) {
          const base64 = e.target.result.split(',')[1];
          playback.dataset.base64 = base64;
          playback.dataset.duration = Math.max(1, Math.round((Date.now() - recordStartTime) / 1000));
          document.getElementById(`btn_submit_${blockId}`).disabled = false;
        };
        reader.readAsDataURL(audioBlob);
        stream.getTracks().forEach(t => t.stop());
      };
      mediaRecorder.start();
      window.recordStartTime = Date.now();

      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (SpeechRecognition) {
        recognition = new SpeechRecognition();
        recognition.lang = 'en-US';
        recognition.continuous = true;
        recognition.interimResults = true;
        
        recognition.onresult = function(event) {
          let interim = '';
          for (let i = event.resultIndex; i < event.results.length; i++) {
            const transcriptPart = event.results[i][0].transcript;
            if (event.results[i].isFinal) {
              finalTranscript += ' ' + transcriptPart;
            } else {
              interim += transcriptPart;
            }
          }
          const displayText = (finalTranscript + ' ' + interim).trim();
          if (displayText) {
            transcriptText.innerText = displayText;
            transcriptText.style.color = '#0c4a6e';
            transcriptText.style.fontStyle = 'normal';
          }
        };
        recognition.onend = function() {
          if (isRecording) { try { recognition.start(); } catch (e) {} }
        };
        try { recognition.start(); } catch (e) { console.warn(e); }
      }
    }).catch(function(err) {
      alert('Tidak bisa mengakses mikrofon: ' + err.message + '\nPastikan Anda mengizinkan akses mikrofon di browser.');
      isRecording = false;
      btn.innerText = '🎙️ MULAI REKAM';
      btn.classList.remove('recording');
      status.innerText = 'Gagal mengakses mikrofon.';
    });
  }

  function stopRecording() {
    if (!isRecording) return;
    isRecording = false;
    
    if (mediaRecorder && mediaRecorder.state !== 'inactive') {
      mediaRecorder.stop();
    }
    if (recognition) {
      try { recognition.stop(); } catch (e) {}
    }

    const blockId = currentActiveBlockId;
    const btn = document.getElementById(`btn_record_${blockId}`);
    const status = document.getElementById(`record_status_${blockId}`);
    
    btn.innerText = '🎙️ REKAM ULANG';
    btn.classList.remove('recording');
    status.innerText = '✅ Rekaman selesai. Anda bisa memutar ulang audio, lalu klik tombol Kirim.';
  }

  async function finalSubmit(blockId, blockType) {
    const btn = document.getElementById(`btn_submit_${blockId}`);
    btn.disabled = true; btn.innerText = '⏳ Mengunggah & Menganalisis...';

    const recorderArea = document.getElementById(`recorder_area_${blockId}`);
    const playback = document.getElementById(`audioPlayback_${blockId}`);
    
    const base64Audio = playback.dataset.base64;
    const duration = playback.dataset.duration;
    const transcript = finalTranscript.trim() || 'No transcript';
    const englishText = document.getElementById(`en_text_${blockId}`).innerText;
    const indonesianText = document.getElementById(`input_${blockId}`).value;

    if (!base64Audio) {
      alert('Anda harus merekam suara terlebih dahulu!');
      btn.disabled = false; btn.innerText = '✅ Kirim Jawaban & Penilaian ke Guru';
      return;
    }

    const fileName = `${activeUser.nama}_${blockId}_${Date.now()}.webm`;
    const audioRes = await callGas('uploadAudioToDrive', { 
      base64Data: base64Audio, 
      fileName: fileName, 
      mimeType: 'audio/webm' 
    });

    if (!audioRes.success) {
      alert('Gagal mengunggah audio: ' + audioRes.message);
      btn.disabled = false; btn.innerText = '✅ Kirim Jawaban';
      return;
    }

    const payload = {
      sheetName: currentSheet,
      studentName: activeUser.nama,
      blockType: blockType,
      blockId: blockId,
      jawabanText: indonesianText,
      jawabanEn: englishText,
      audioUrl: audioRes.downloadUrl,
      recordingDuration: duration,
      speechTranscript: transcript,
      similarityScore: 85, // Simulasi skor, bisa diganti dengan logika AI Anda
      colIndices: {
        jawabId: parseInt(recorderArea.dataset.colJawabId),
        jawabEn: parseInt(recorderArea.dataset.colJawabEn),
        audio: parseInt(recorderArea.dataset.colAudio),
        transkrip: parseInt(recorderArea.dataset.colTranskrip),
        akurasi: parseInt(recorderArea.dataset.colAkurasi),
        feedbackId: parseInt(recorderArea.dataset.colFeedbackId)
      }
    };

    const res = await callGas('submitStudentAnswer', payload);
    
    if (res.success) {
      alert('✅ Kerja bagus! Jawaban dan rekaman Anda berhasil dikirim.');
      const activeBtn = document.querySelector(`button[style*="background-color: var(--secondary)"]`);
      loadSheet(currentSheet, activeBtn);
    } else {
      alert('Gagal menyimpan: ' + res.message);
      btn.disabled = false; btn.innerText = '✅ Kirim Jawaban';
    }
  }

  async function submitMCMA(blockId, colFeedbackId) {
    const checkboxes = document.querySelectorAll(`input[name="mcma_${blockId}"]:checked`);
    const jawaban = Array.from(checkboxes).map(cb => cb.value).join(',');
    if (!jawaban) { alert('Pilih minimal satu jawaban!'); return; }
    
    const payload = {
      sheetName: currentSheet,
      studentName: activeUser.nama,
      blockType: 'mcma',
      blockId: blockId,
      jawabanText: 'MCMA: ' + jawaban,
      colIndices: { feedbackId: colFeedbackId }
    };
    
    const res = await callGas('submitStudentAnswer', payload);
    if (res.success) {
      alert('✅ Jawaban MCMA tersimpan!');
      const activeBtn = document.querySelector(`button[style*="background-color: var(--secondary)"]`);
      loadSheet(currentSheet, activeBtn);
    }
  }

  async function submitTF(blockId, answerKey, colFeedbackId) {
    const selected = document.querySelector(`input[name="tf_${blockId}"]:checked`);
    if (!selected) { alert('Pilih True atau False!'); return; }
    
    const isCorrect = selected.value === answerKey;
    const payload = {
      sheetName: currentSheet,
      studentName: activeUser.nama,
      blockType: 'true_false',
      blockId: blockId,
      jawabanText: 'TF: ' + selected.value + (isCorrect ? ' (Benar)' : ' (Salah, Kunci: ' + answerKey + ')'),
      colIndices: { feedbackId: colFeedbackId }
    };
    
    const res = await callGas('submitStudentAnswer', payload);
    if (res.success) {
      alert(isCorrect ? '✅ Benar! Jawaban tersimpan.' : '❌ Salah. Jawaban tersimpan, pelajari feedbacknya.');
      const activeBtn = document.querySelector(`button[style*="background-color: var(--secondary)"]`);
      loadSheet(currentSheet, activeBtn);
    }
  }
</script>
