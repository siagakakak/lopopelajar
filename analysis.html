<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Analisis Descriptive Text - Lopo Pelajar App 2</title>
<style>
:root{--primary:#1b365d;--secondary:#0066cc;--accent:#d97706;--danger:#dc2626;--success:#16a34a;--bg:#f8fafc;--card-bg:#fff;--text:#1e293b;}
*{box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,sans-serif;line-height:1.7;color:var(--text);background:var(--bg);margin:0;padding:0;}
.no-copy{-webkit-user-select:none;user-select:none}
.header-banner{background:var(--primary);color:#fff;padding:20px;text-align:center;box-shadow:0 4px 6px rgba(0,0,0,.1)}
.header-banner h1{margin:0;font-size:1.6rem}
.nav-bar{display:flex;background:#0f172a;overflow-x:auto;padding:0 10px}
.nav-tab{padding:14px 20px;color:#94a3b8;cursor:pointer;font-weight:600;white-space:nowrap;border-bottom:3px solid transparent;transition:.2s}
.nav-tab.active{color:#fff;border-bottom-color:var(--secondary);background:rgba(255,255,255,.05)}
.container{max-width:1400px;margin:20px auto;padding:0 15px}
.container-narrow{max-width:500px;margin:60px auto;padding:0 15px}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
@media(max-width:900px){.two-col{grid-template-columns:1fr}}
.card{background:var(--card-bg);padding:22px;margin-bottom:20px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.05);border:1px solid #e2e8f0}
.section-title{color:var(--primary);font-size:1.15rem;margin-top:0;border-bottom:2px solid #e2e8f0;padding-bottom:8px}
.formatted-paragraph{font-size:1.02rem;font-weight:500;color:#0f172a;margin-bottom:12px;text-align:justify}
.pronounce-block{background:#f0f9ff;border-left:4px solid var(--secondary);padding:12px 16px;color:#0369a1;font-style:italic;border-radius:4px;margin-bottom:12px;line-height:1.6}
.translation-block{background:#f0fdf4;border-left:4px solid var(--success);padding:12px 16px;color:#15803d;border-radius:4px;margin-bottom:20px;line-height:1.6}
.audio-controls{display:flex;gap:8px;align-items:center;margin:8px 0;flex-wrap:wrap}
.btn-audio{border:none;padding:6px 12px;border-radius:16px;cursor:pointer;font-weight:600;font-size:.8rem;display:inline-flex;align-items:center;gap:5px;color:#fff}
.btn-play-en{background:var(--secondary)}
.btn-play-id{background:var(--success)}
.btn-stop{background:var(--danger)}
.speed-tag{font-size:.75rem;background:#e2e8f0;padding:3px 8px;border-radius:10px;font-weight:bold}
.form-group{margin-bottom:15px}
label{display:block;font-weight:600;margin-bottom:6px}
input[type=text],input[type=password],select,textarea{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:8px;font-family:inherit;font-size:1rem;background:#fff}
textarea{height:130px;resize:vertical}
.password-wrapper{position:relative;display:flex;align-items:center}
.password-wrapper input{padding-right:45px}
.toggle-password{position:absolute;right:12px;cursor:pointer;font-size:1.2rem;color:#64748b;user-select:none}
.char-count{font-size:.85rem;text-align:right;color:#64748b;margin-top:4px}
.char-count.valid{color:var(--success);font-weight:bold}
.btn-submit{background:var(--success);color:#fff;border:none;padding:12px 20px;border-radius:8px;width:100%;font-size:1rem;font-weight:bold;cursor:pointer;margin-top:10px;transition:.2s}
.btn-submit:hover{opacity:.92}
.btn-submit:disabled{background:#cbd5e1;cursor:not-allowed}
.btn-primary{background:var(--primary)}
.btn-secondary{background:var(--secondary)}
.btn-record{background:var(--danger);color:#fff;border:none;padding:14px 24px;border-radius:50px;font-size:1.05rem;font-weight:bold;cursor:pointer;display:inline-flex;align-items:center;gap:10px;box-shadow:0 4px 12px rgba(220,38,38,.3);transition:.2s}
.btn-record:hover{transform:scale(1.03)}
.btn-record.recording{background:#991b1b;animation:pulseRec 1s infinite}
@keyframes pulseRec{0%,100%{opacity:1}50%{opacity:.6}}
.btn-record:disabled{background:#cbd5e1;cursor:not-allowed;box-shadow:none}
.alert{padding:12px;border-radius:8px;margin-top:15px;display:none}
.alert-danger{background:#fef2f2;color:#991b1b;border:1px solid #fecaca}
.alert-success{background:#f0fdf4;color:#15803d;border:1px solid #86efac}
.recorder-box{background:#fff7ed;padding:20px;border-radius:8px;border:1px solid #fdba74;margin-top:15px}
.live-transcript-box{background:#f0f9ff;border-left:4px solid var(--secondary);padding:12px;margin-top:15px;border-radius:4px;min-height:50px;font-size:.92rem;color:#0c4a6e}
.live-transcript-box .label{font-weight:bold;color:var(--secondary);font-size:.82rem;display:block;margin-bottom:4px}
.recorder-status{font-size:.93rem;margin-top:10px;color:#7c2d12;font-weight:600;text-align:center}
.recorder-status.recording{color:var(--danger)}
.recorder-status.done{color:var(--success)}
.audio-playback-custom{width:100%;margin-top:12px;display:none}
.block-tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;margin-bottom:12px;border-bottom:2px solid #e2e8f0}
.block-tab{padding:8px 14px;background:#e2e8f0;color:#334155;border-radius:8px;cursor:pointer;font-weight:600;font-size:.82rem;white-space:nowrap;transition:.2s;border-left:4px solid transparent}
.block-tab.active{background:var(--secondary);color:#fff}
.block-tab.done{border-left-color:var(--success)}
.block-tab.warn{border-left-color:var(--danger);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.7}}
.sub-tabs{display:flex;gap:6px;margin-bottom:14px;padding-bottom:8px;border-bottom:2px dashed #cbd5e1}
.sub-tab{padding:6px 14px;background:#f1f5f9;color:#475569;border-radius:6px;cursor:pointer;font-weight:600;font-size:.85rem;transition:.2s}
.sub-tab.active{background:var(--primary);color:#fff}
.feedback-area{background:#eff6ff;border:2px solid var(--secondary);border-radius:12px;padding:18px;margin-top:15px}
.feedback-area h4{margin-top:0;color:var(--secondary)}
.saved-answer-preview{background:#f0fdf4;border:1px solid #86efac;padding:14px;border-radius:8px;margin-bottom:15px;border-left:4px solid var(--success)}
.saved-answer-preview h4{margin-top:0;color:var(--success)}
.audio-review-box{background:#fff;border-radius:10px;padding:15px;border:1px solid #e2e8f0;line-height:1.7}
.no-data-msg{color:#64748b;font-style:italic;text-align:center;padding:20px}
</style>
</head>
<body>

<div class="header-banner">
  <h1>Interactive English Learning Platform Lopopelajar.com</h1>
  <h1>Analisis Descriptive Text "People" — Level HOTS</h1>
</div>

<!-- ========== LOGIN ========== -->
<div id="login-container" class="container-narrow">
  <div class="card">
    <h2 class="section-title">Masuk Portal Siswa</h2>
    <form onsubmit="executeLogin(event)">
      <div class="form-group">
        <label>Nama Lengkap</label>
        <input type="text" id="inputNama" required placeholder="Ketik nama lengkapmu">
      </div>
      <div class="form-group">
        <label>Password</label>
        <div class="password-wrapper">
          <input type="password" id="inputPass" required placeholder="Ketik password">
          <span class="toggle-password" id="toggleEye" onclick="togglePasswordVisibility()">👁️</span>
        </div>
      </div>
      <div class="form-group">
        <label>Kelas</label>
        <select id="inputKelas" required>
          <option value="">-- Pilih Kelas --</option>
          <option value="7A">7A</option><option value="7B">7B</option><option value="7C">7C</option>
          <option value="7D">7D</option><option value="7E">7E</option><option value="7F">7F</option>
          <option value="7G">7G</option><option value="7H">7H</option><option value="7I">7I</option>
          <option value="7J">7J</option><option value="7K">7K</option><option value="7L">7L</option>
          <option value="7M">7M</option><option value="7N">7N</option><option value="7O">7O</option>
          <option value="7P">7P</option><option value="7Q">7Q</option><option value="7R">7R</option>
          <option value="7S">7S</option><option value="7T">7T</option><option value="7U">7U</option>
          <option value="7V">7V</option><option value="7W">7W</option><option value="7X">7X</option>
          <option value="7Y">7Y</option><option value="7Z">7Z</option>
        </select>
      </div>
      <button type="submit" class="btn-submit" id="btnLogin">🚪 Enter / Masuk</button>
    </form>
    <div id="loginError" class="alert alert-danger"></div>
  </div>
</div>

<!-- ========== MAIN APP ========== -->
<div id="main-app" style="display:none">
  <div class="nav-bar" id="navTabs"></div>
  <div class="container">
    <div class="two-col">
      <!-- KIRI: MATERI -->
      <div>
        <div class="card no-copy">
          <h2 class="section-title" id="materiTitle">Materi</h2>
          <div id="materi-content-area"></div>
        </div>
      </div>
      <!-- KANAN: ANALISIS -->
      <div>
        <div class="card">
          <h2 class="section-title">📚 Analisis Teks — 10 Blok</h2>
          <div class="block-tabs" id="blockTabs"></div>
          <div class="sub-tabs" id="subTabs">
            <div class="sub-tab active" data-sub="instruksi" onclick="switchSubTab('instruksi')">📖 Instruksi</div>
            <div class="sub-tab" data-sub="jawaban" onclick="switchSubTab('jawaban')">✍️ Jawaban & Feedback</div>
          </div>
          <div id="block-content-area"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const GAS_API_URL = 'https://script.google.com/macros/s/AKfycby-tkOj2UT964fXSr1q22Sw0JjNt30WjiOco5tnQfZViwIiHXyNdJwggh_ZCkTc4qYT6g/exec';

// ==========================================
// STATE
// ==========================================
let activeUser = { nama:'', password:'', kelas:'' };
let availableSheets = [];
let currentSheet = '';
let currentSheetData = null;
let activeBlockKey = '';
let activeSubTab = 'instruksi';
let availableVoices = [];
let mediaRecorder = null, audioChunks = [], recognition = null;
let finalTranscript = '', isRecording = false, recordStartTime = 0;
let audioBlobGlobal = null;

const BLOCK_ORDER = [
  { key:'identification', icon:'🔍', short:'Identification' },
  { key:'description',    icon:'📝', short:'Description' },
  { key:'simple_present', icon:'⏳', short:'Simple Present' },
  { key:'linking_verbs',  icon:'🌉', short:'Linking Verbs' },
  { key:'have_has',       icon:'🎁', short:'Have/Has' },
  { key:'action_verbs',   icon:'🏃', short:'Action Verbs' },
  { key:'pronoun_refs',   icon:'🔗', short:'Pronoun Refs' },
  { key:'adjectives',     icon:'🎨', short:'Adjectives' },
  { key:'noun_phrases',   icon:'💎', short:'Noun Phrases' },
  { key:'distinguishing', icon:'✨', short:'Distinguishing' }
];

// ==========================================
// VOICES
// ==========================================
function loadVoices(){ availableVoices = window.speechSynthesis.getVoices(); }
loadVoices();
if (window.speechSynthesis.onvoiceschanged !== undefined) window.speechSynthesis.onvoiceschanged = loadVoices;

function getIndonesianVoice(){
  let v = availableVoices.find(x=>x.lang==='id-ID'&&x.name.toLowerCase().includes('google'));
  if(!v) v = availableVoices.find(x=>x.lang==='id-ID');
  return v || null;
}
function getEnglishVoice(){
  let v = availableVoices.find(x=>x.lang==='en-US'&&x.name.toLowerCase().includes('google'));
  if(!v) v = availableVoices.find(x=>x.lang==='en-US');
  if(!v) v = availableVoices.find(x=>x.lang.startsWith('en'));
  return v || null;
}

function playText(txt, lang, rate){
  speechStop();
  if(!txt || !txt.trim()) return;
  if(availableVoices.length === 0) loadVoices();
  const u = new SpeechSynthesisUtterance(txt.trim());
  u.rate = rate || (lang==='id-ID'?0.85:0.75);
  u.lang = lang;
  if(lang==='id-ID'){ const v=getIndonesianVoice(); if(v) u.voice=v; }
  else { const v=getEnglishVoice(); if(v) u.voice=v; }
  window.speechSynthesis.speak(u);
}
function speechStop(){ window.speechSynthesis.cancel(); }

// ==========================================
// CALL GAS
// ==========================================
async function callGas(action, payload){
  try{
    const res = await fetch(GAS_API_URL, {
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({ action, payload })
    });
    return await res.json();
  }catch(err){
    return { success:false, message:'Koneksi gagal: ' + err.message };
  }
}

// ==========================================
// LOGIN
// ==========================================
function togglePasswordVisibility(){
  const p = document.getElementById('inputPass');
  const e = document.getElementById('toggleEye');
  if(p.type === 'password'){ p.type='text'; e.innerText='🙈'; }
  else { p.type='password'; e.innerText='👁️'; }
}

async function executeLogin(e){
  e.preventDefault();
  const nama = document.getElementById('inputNama').value;
  const pass = document.getElementById('inputPass').value;
  const kelas = document.getElementById('inputKelas').value;
  const btn = document.getElementById('btnLogin');
  const err = document.getElementById('loginError');
  btn.disabled = true; btn.innerText = '⏳ Memproses...'; err.style.display='none';
  const res = await callGas('login', { nama, password:pass, kelas });
  btn.disabled = false; btn.innerText = '🚪 Enter / Masuk';
  if(res.success){
    activeUser = { nama:res.nama, password:pass, kelas:res.kelas };
    availableSheets = res.availableSheets || [];
    document.getElementById('login-container').style.display='none';
    document.getElementById('main-app').style.display='block';
    buildNavTabs();
  } else {
    err.innerText = res.message; err.style.display='block';
  }
}

// ==========================================
// NAV TABS
// ==========================================
function buildNavTabs(){
  const nav = document.getElementById('navTabs');
  nav.innerHTML = '';
  availableSheets.forEach((name, i)=>{
    const t = document.createElement('div');
    t.className = 'nav-tab' + (i===0?' active':'');
    t.innerText = name;
    t.onclick = ()=>{
      document.querySelectorAll('.nav-tab').forEach(x=>x.classList.remove('active'));
      t.classList.add('active');
      loadSheet(name);
    };
    nav.appendChild(t);
  });
  if(availableSheets.length > 0) loadSheet(availableSheets[0]);
}

// ==========================================
// LOAD SHEET
// ==========================================
async function loadSheet(name){
  currentSheet = name;
  document.getElementById('materiTitle').innerText = '📖 ' + name;
  speechStop();
  const data = await callGas('getSheetData', { sheetName:name, studentName:activeUser.nama });
  if(!data || !data.materi){
    document.getElementById('materi-content-area').innerHTML = '<div class="no-data-msg">Data tidak ditemukan untuk sheet ini.</div>';
    return;
  }
  currentSheetData = data;
  renderMateri();
  renderBlockTabs();
  switchBlock(BLOCK_ORDER[0].key);
}

function renderMateri(){
  const area = document.getElementById('materi-content-area');
  area.innerHTML = '';
  const m = currentSheetData.materi;
  const enParas = m.materiEn ? m.materiEn.split(/\n+/).filter(p=>p.trim()) : [];
  const prParas = m.materiPronounce ? m.materiPronounce.split(/\n+/).filter(p=>p.trim()) : [];
  const idParas = m.materiId ? m.materiId.split(/\n+/).filter(p=>p.trim()) : [];
  const maxP = Math.max(enParas.length, idParas.length, prParas.length);
  for(let i=0;i<maxP;i++){
    const div = document.createElement('div');
    div.style.marginBottom = '18px';
    if(enParas[i]){
      const ctrl = document.createElement('div'); ctrl.className='audio-controls';
      const b1 = document.createElement('button'); b1.className='btn-audio btn-play-en'; b1.innerHTML='▶ Play EN';
      b1.onclick = ()=>playText(enParas[i], 'en-US', 0.75);
      const b2 = document.createElement('button'); b2.className='btn-audio btn-stop'; b2.innerHTML='⏹ Stop';
      b2.onclick = speechStop;
      ctrl.appendChild(b1); ctrl.appendChild(b2);
      ctrl.appendChild(Object.assign(document.createElement('span'),{className:'speed-tag',innerText:'Kecepatan: 0.75x'}));
      div.appendChild(ctrl);
      const p = document.createElement('div'); p.className='formatted-paragraph'; p.innerText=enParas[i];
      div.appendChild(p);
    }
    if(prParas[i]){
      const p = document.createElement('div'); p.className='pronounce-block'; p.innerText=prParas[i];
      div.appendChild(p);
    }
    if(idParas[i]){
      const ctrl = document.createElement('div'); ctrl.className='audio-controls';
      const b1 = document.createElement('button'); b1.className='btn-audio btn-play-id'; b1.innerHTML='▶ Play ID';
      b1.onclick = ()=>playText(idParas[i], 'id-ID', 0.85);
      const b2 = document.createElement('button'); b2.className='btn-audio btn-stop'; b2.innerHTML='⏹ Stop';
      b2.onclick = speechStop;
      ctrl.appendChild(b1); ctrl.appendChild(b2);
      ctrl.appendChild(Object.assign(document.createElement('span'),{className:'speed-tag',innerText:'Kecepatan: 0.85x'}));
      div.appendChild(ctrl);
      const p = document.createElement('div'); p.className='translation-block'; p.innerText=idParas[i];
      div.appendChild(p);
    }
    area.appendChild(div);
  }
}

// ==========================================
// BLOCK TABS
// ==========================================
function renderBlockTabs(){
  const c = document.getElementById('blockTabs');
  c.innerHTML = '';
  BLOCK_ORDER.forEach(b=>{
    const tab = document.createElement('div');
    const sub = currentSheetData.submissions && currentSheetData.submissions[b.key];
    let cls = 'block-tab';
    if(sub){
      const acc = parseFloat(String(sub.accuracy).replace('%','')) || 0;
      if(acc >= 60) cls += ' done';
      else if(acc > 0) cls += ' warn';
    }
    if(b.key === activeBlockKey) cls += ' active';
    tab.className = cls;
    tab.innerText = b.icon + ' ' + b.short;
    tab.onclick = ()=>switchBlock(b.key);
    c.appendChild(tab);
  });
}

function switchBlock(key){
  activeBlockKey = key;
  activeSubTab = 'instruksi';
  document.querySelectorAll('.block-tab').forEach(t=>t.classList.remove('active'));
  const tabs = document.querySelectorAll('.block-tab');
  BLOCK_ORDER.forEach((b,i)=>{ if(b.key===key && tabs[i]) tabs[i].classList.add('active'); });
  document.querySelectorAll('.sub-tab').forEach(t=>{
    t.classList.toggle('active', t.dataset.sub === 'instruksi');
  });
  renderBlockContent();
}

function switchSubTab(sub){
  activeSubTab = sub;
  document.querySelectorAll('.sub-tab').forEach(t=>t.classList.toggle('active', t.dataset.sub === sub));
  renderBlockContent();
}

// ==========================================
// RENDER BLOCK CONTENT
// ==========================================
function renderBlockContent(){
  const area = document.getElementById('block-content-area');
  area.innerHTML = '';
  const block = currentSheetData.blocks.find(b=>b.key === activeBlockKey);
  if(!block){ area.innerHTML = '<div class="no-data-msg">Blok tidak ditemukan.</div>'; return; }
  
  if(activeSubTab === 'instruksi'){
    // Instruksi EN
    if(block.instruksiEn){
      const ctrl = document.createElement('div'); ctrl.className='audio-controls';
      const b1 = document.createElement('button'); b1.className='btn-audio btn-play-en'; b1.innerHTML='▶ Play EN';
      b1.onclick = ()=>playText(block.instruksiEn, 'en-US', 0.75);
      const b2 = document.createElement('button'); b2.className='btn-audio btn-stop'; b2.innerHTML='⏹ Stop';
      b2.onclick = speechStop;
      ctrl.appendChild(b1); ctrl.appendChild(b2);
      ctrl.appendChild(Object.assign(document.createElement('span'),{className:'speed-tag',innerText:'Kecepatan: 0.75x'}));
      area.appendChild(ctrl);
      const p = document.createElement('div'); p.className='formatted-paragraph';
      p.innerHTML = block.instruksiEn.replace(/\n/g,'<br>');
      area.appendChild(p);
    }
    // Pronounce
    if(block.instruksiPronounce){
      const p = document.createElement('div'); p.className='pronounce-block'; p.innerText=block.instruksiPronounce;
      area.appendChild(p);
    }
    // ID
    if(block.instruksiId){
      const ctrl = document.createElement('div'); ctrl.className='audio-controls';
      const b1 = document.createElement('button'); b1.className='btn-audio btn-play-id'; b1.innerHTML='▶ Play ID';
      b1.onclick = ()=>playText(block.instruksiId, 'id-ID', 0.85);
      const b2 = document.createElement('button'); b2.className='btn-audio btn-stop'; b2.innerHTML='⏹ Stop';
      b2.onclick = speechStop;
      ctrl.appendChild(b1); ctrl.appendChild(b2);
      ctrl.appendChild(Object.assign(document.createElement('span'),{className:'speed-tag',innerText:'Kecepatan: 0.85x'}));
      area.appendChild(ctrl);
      const p = document.createElement('div'); p.className='translation-block';
      p.innerHTML = block.instruksiId.replace(/\n/g,'<br>');
      area.appendChild(p);
    }
  } else {
    // Jawaban & Feedback
    const sub = currentSheetData.submissions && currentSheetData.submissions[activeBlockKey];
    if(sub){
      // Sudah dijawab
      renderSavedSubmission(sub, block);
    } else {
      // Form jawaban
      renderAnswerForm(block);
    }
  }
}

// ==========================================
// FORM JAWABAN
// ==========================================
function renderAnswerForm(block){
  const area = document.getElementById('block-content-area');
  area.innerHTML = '';
  
  const note = document.createElement('div');
  note.style.cssText = 'background:#fef3c7;padding:12px;border-radius:8px;margin-bottom:15px;color:#92400e;font-size:.92rem';
  note.innerHTML = '📝 Tulis analisismu dalam <b>Bahasa Indonesia</b> (minimal 100 karakter), lalu klik kirim. Sistem akan menerjemahkan ke Bahasa Inggris, lalu kamu baca dengan lantang dan rekam.';
  area.appendChild(note);
  
  const ta = document.createElement('textarea');
  ta.id = 'answerInput';
  ta.placeholder = 'Tulis analisismu di sini...';
  ta.oninput = checkLength;
  ta.onpaste = (e)=>{ e.preventDefault(); alert('Copy-paste dimatikan. Harap ketik jawabanmu sendiri.'); };
  area.appendChild(ta);
  
  const cc = document.createElement('div');
  cc.className = 'char-count'; cc.id = 'charCounter'; cc.innerText = '0 / 100 Karakter Minimum';
  area.appendChild(cc);
  
  const btn = document.createElement('button');
  btn.className = 'btn-submit btn-secondary'; btn.id = 'btnGetTranslation'; btn.disabled = true;
  btn.innerHTML = '📤 Kirimkan Jawaban';
  btn.onclick = ()=>requestTranslation(block);
  area.appendChild(btn);
  
  const errDiv = document.createElement('div');
  errDiv.className = 'alert alert-danger'; errDiv.id = 'ansError';
  area.appendChild(errDiv);

function checkLength(){
  const v = document.getElementById('answerInput').value;
  const cc = document.getElementById('charCounter');
  const btn = document.getElementById('btnGetTranslation');
  cc.innerText = v.length + ' / 100 Karakter Minimum';
  if(v.length >= 100){ cc.className='char-count valid'; btn.disabled=false; }
  else { cc.className='char-count'; btn.disabled=true; }
}

let lastSubmittedAnswer = '';
let lastEnglishText = '';

async function requestTranslation(block){
  const text = document.getElementById('answerInput').value;
  const btn = document.getElementById('btnGetTranslation');
  const err = document.getElementById('ansError');
  if(text.length < 100){ err.innerText='Minimal 100 karakter!'; err.style.display='block'; return; }
  btn.disabled=true; btn.innerText='⏳ Memproses...'; err.style.display='none';
  lastSubmittedAnswer = text;
  const res = await callGas('getInstantTranslation', { text });
  btn.disabled=false; btn.innerText='📤 Kirimkan Jawaban';
  if(res.success){
    lastEnglishText = res.jawabanEn;
    document.getElementById('answerInput').value = '';
    document.getElementById('charCounter').innerText = '0 / 100 Karakter Minimum';
    document.getElementById('charCounter').className = 'char-count';
    document.getElementById('btnGetTranslation').disabled = true;
    document.getElementById('speakingPracticeArea').style.display = 'block';
    const pe = document.getElementById('preview-en-area'); pe.innerHTML = '';
    const p = document.createElement('div'); p.className='formatted-paragraph'; p.innerText = res.jawabanEn;
    pe.appendChild(p);
    const ctrl = document.createElement('div'); ctrl.className='audio-controls';
    const b1 = document.createElement('button'); b1.className='btn-audio btn-play-en'; b1.innerHTML='▶ Dengarkan';
    b1.onclick = ()=>playText(res.jawabanEn, 'en-US', 0.75);
    const b2 = document.createElement('button'); b2.className='btn-audio btn-stop'; b2.innerHTML='⏹ Stop';
    b2.onclick = speechStop;
    ctrl.appendChild(b1); ctrl.appendChild(b2);
    ctrl.appendChild(Object.assign(document.createElement('span'),{className:'speed-tag',innerText:'Kecepatan: 0.75x'}));
    pe.appendChild(ctrl);
    document.getElementById('preview-pronounce-area').innerText = res.jawabanPronounce;
    document.getElementById('speakingPracticeArea').scrollIntoView({ behavior:'smooth' });
  } else {
    err.innerText = res.message; err.style.display='block';
  }
}

// ==========================================
// RECORDING
// ==========================================
function checkBrowserSupport(){
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ alert('Browser tidak mendukung Web Speech API. Gunakan Chrome/Edge terbaru.'); return false; }
  if(!window.MediaRecorder){ alert('Browser tidak mendukung MediaRecorder. Gunakan Chrome/Edge terbaru.'); return false; }
  return true;
}

function startRecording(){
  if(!checkBrowserSupport()) return;
  finalTranscript = ''; audioChunks = []; isRecording = true; recordStartTime = Date.now();
  document.getElementById('recorderStatus').innerText = '🔴 SEDANG MEREKAM... Baca dengan lantang!';
  document.getElementById('recorderStatus').className = 'recorder-status recording';
  document.getElementById('btnRecordToggle').innerText = '⏹ SELESAI REKAM';
  document.getElementById('btnRecordToggle').classList.add('recording');
  document.getElementById('liveTranscriptBox').style.display = 'block';
  document.getElementById('liveTranscriptText').innerText = 'Mulai bicara...';
  document.getElementById('liveTranscriptText').style.color = '#64748b';
  document.getElementById('liveTranscriptText').style.fontStyle = 'italic';
  
  navigator.mediaDevices.getUserMedia({ audio:true }).then(stream=>{
    mediaRecorder = new MediaRecorder(stream);
    mediaRecorder.ondataavailable = e=>{ if(e.data && e.data.size > 0) audioChunks.push(e.data); };
    mediaRecorder.onstop = ()=>{
      const mime = mediaRecorder.mimeType || 'audio/webm';
      audioBlobGlobal = new Blob(audioChunks, { type:mime });
      const url = URL.createObjectURL(audioBlobGlobal);
      const ap = document.getElementById('audioPlayback');
      ap.src = url; ap.style.display = 'block';
      stream.getTracks().forEach(t=>t.stop());
      const reader = new FileReader();
      reader.onload = e=>{
        document.getElementById('audioDataUrl').value = e.target.result.split(',')[1];
        document.getElementById('audioMimeType').value = mime;
        const durSec = Math.max(1, Math.round((Date.now()-recordStartTime)/1000));
        document.getElementById('audioDuration').value = durSec;
        checkReadyToSubmit();
      };
      reader.readAsDataURL(audioBlobGlobal);
    };
    mediaRecorder.start();
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    recognition = new SR();
    recognition.lang='en-US'; recognition.continuous=true; recognition.interimResults=true;
    recognition.onresult = ev=>{
      let interim = '';
      for(let i=ev.resultIndex;i<ev.results.length;i++){
        const t = ev.results[i][0].transcript;
        if(ev.results[i].isFinal) finalTranscript += ' ' + t;
        else interim += t;
      }
      const disp = (finalTranscript + ' ' + interim).trim();
      if(disp){
        const box = document.getElementById('liveTranscriptText');
        box.innerText = disp; box.style.color = '#0c4a6e'; box.style.fontStyle = 'normal';
      }
    };
    recognition.onerror = ev=>console.warn('SR error:', ev.error);
    recognition.onend = ()=>{ if(isRecording){ try{ recognition.start(); }catch(e){} } };
    try{ recognition.start(); }catch(e){}
  }).catch(err=>{
    alert('Tidak bisa akses mikrofon: ' + err.message);
    isRecording = false;
    document.getElementById('btnRecordToggle').innerText = '🎙️ MULAI REKAM';
    document.getElementById('btnRecordToggle').classList.remove('recording');
  });
}

function stopRecording(){
  if(!isRecording) return;
  isRecording = false;
  if(mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
  if(recognition){ try{ recognition.stop(); }catch(e){} }
  document.getElementById('recorderStatus').innerText = '✅ Rekaman selesai. Dengarkan ulang, lalu klik Kirim.';
  document.getElementById('recorderStatus').className = 'recorder-status done';
  document.getElementById('btnRecordToggle').innerText = '🎙️ REKAM ULANG';
  document.getElementById('btnRecordToggle').classList.remove('recording');
  document.getElementById('speechTranscript').value = (finalTranscript || '').trim();
}

function toggleRecording(){ if(isRecording) stopRecording(); else startRecording(); }
function checkReadyToSubmit(){
  document.getElementById('btnSubmitFinal').disabled = !document.getElementById('audioDataUrl').value;
}

// ==========================================
// SUBMIT FINAL
// ==========================================
async function submitFinal(){
  const btn = document.getElementById('btnSubmitFinal');
  const err = document.getElementById('ansError');
  const audioData = document.getElementById('audioDataUrl').value;
  const dur = document.getElementById('audioDuration').value;
  const speech = document.getElementById('speechTranscript').value || '';
  
  if(!audioData){ err.innerText='Anda harus merekam suara dulu!'; err.style.display='block'; return; }
  btn.disabled=true; btn.innerText='⏳ Mengunggah...'; err.style.display='none';
  
  const fileName = activeUser.nama + '_' + activeBlockKey + '_' + Date.now() + '.webm';
  const mime = document.getElementById('audioMimeType').value || 'audio/webm';
  
  const audioRes = await callGas('uploadAudioToDrive', { base64Data:audioData, fileName, mimeType:mime });
  if(!audioRes.success){
    btn.disabled=false; btn.innerText='✅ Kirim Jawaban & Penilaian ke Guru';
    err.innerText = 'Gagal upload: ' + audioRes.message; err.style.display='block';
    return;
  }
  
  const res = await callGas('submitAnalysis', {
    sheetName: currentSheet,
    studentName: activeUser.nama,
    kelas: activeUser.kelas,
    blockKey: activeBlockKey,
    jawabanText: lastSubmittedAnswer,
    audioUrl: audioRes.url,
    recordingDuration: dur,
    originalEnglishText: lastEnglishText,
    fileSizeBytes: audioRes.sizeBytes,
    speechTranscript: speech
  });
  
  btn.disabled=false; btn.innerText='✅ Kirim Jawaban & Penilaian ke Guru';
  
  if(res.success){
    if(!currentSheetData.submissions) currentSheetData.submissions = {};
    currentSheetData.submissions[activeBlockKey] = {
      ansId: lastSubmittedAnswer,
      ansEn: res.jawabanEn,
      ansPronounce: res.jawabanPronounce,
      audioUrl: audioRes.downloadUrl,
      transkrip: res.speechTranscript,
      assessment: res.speakingAssessment,
      accuracy: res.similarityScore + '%',
      feedbackEn: res.feedbackEn,
      feedbackPronounce: res.feedbackPronounce,
      feedbackId: res.feedbackId
    };
    renderBlockTabs();
    switchBlock(activeBlockKey);
    if(res.requiresReupload) alert('⚠️ ' + res.rerecordMessage);
    else alert('✅ Kerja bagus! Jawaban & audio sudah tersimpan.');
  } else {
    err.innerText = res.message; err.style.display='block';
  }
}

function renderSavedSubmission(sub, block){
  const area = document.getElementById('block-content-area');
  area.innerHTML = '';
  
  // Preview jawaban
  const prev = document.createElement('div');
  prev.className = 'saved-answer-preview';
  prev.innerHTML = '<h4>✅ Jawaban Anda (Bahasa Indonesia):</h4><div class="formatted-paragraph">' + (sub.ansId || '').replace(/\n/g,'<br>') + '</div>';
  area.appendChild(prev);
  
  // Terjemahan EN
  if(sub.ansEn){
    const h = document.createElement('h4'); h.style.color='var(--primary)'; h.innerText='🌐 Terjemahan Bahasa Inggris:';
    area.appendChild(h);
    const p = document.createElement('div'); p.className='formatted-paragraph'; p.innerText=sub.ansEn;
    area.appendChild(p);
    if(sub.ansPronounce){
      const pp = document.createElement('div'); pp.className='pronounce-block'; pp.innerText=sub.ansPronounce;
      area.appendChild(pp);
    }
  }
  
  // Penilaian Audio AI
  if(sub.assessment){
    const h = document.createElement('h4'); h.style.cssText='color:var(--accent);margin-top:20px';
    h.innerText='🎙️ Ulasan Pengucapan Audio dari Guru:';
    area.appendChild(h);
    const box = document.createElement('div');
    box.className = 'audio-review-box';
    box.innerHTML = (sub.assessment || '').replace(/\n/g,'<br>');
    area.appendChild(box);
    
    if(sub.audioUrl){
      const playBtn = document.createElement('button');
      playBtn.className = 'btn-submit'; playBtn.style.cssText='background:var(--accent);max-width:300px;margin:15px auto 0;display:block';
      playBtn.innerText = '🎧 Dengarkan Suara Kamu!';
      playBtn.onclick = ()=>{ window.open(sub.audioUrl, '_blank'); };
      area.appendChild(playBtn);
    }
  }
  
  // Feedback Guru
  if(sub.feedbackEn || sub.feedbackId){
    const fbArea = document.createElement('div');
    fbArea.className = 'feedback-area';
    let html = '<h4>🏫 Feedback Konstruktif & Apresiasi Guru:</h4>';
    if(sub.feedbackEn){
      html += '<div style="margin-bottom:15px"><strong style="color:var(--secondary)">🇬🇧 English Feedback:</strong>';
      html += '<div class="audio-controls"><button class="btn-audio btn-play-en" onclick="playText(' + JSON.stringify(sub.feedbackEn) + ',\'en-US\',0.75)">▶ Play EN</button>';
      html += '<button class="btn-audio btn-stop" onclick="speechStop()">⏹ Stop</button></div>';
      html += '<div class="formatted-paragraph" style="margin-top:8px">' + sub.feedbackEn + '</div></div>';
    }
    if(sub.feedbackPronounce){
      html += '<div class="pronounce-block" style="margin-bottom:15px">' + sub.feedbackPronounce + '</div>';
    }
    if(sub.feedbackId){
      html += '<div style="margin-bottom:15px"><strong style="color:var(--success)">🇮🇩 Terjemahan Bahasa Indonesia:</strong>';
      html += '<div class="audio-controls"><button class="btn-audio btn-play-id" onclick="playText(' + JSON.stringify(sub.feedbackId) + ',\'id-ID\',0.85)">▶ Play ID</button>';
      html += '<button class="btn-audio btn-stop" onclick="speechStop()">⏹ Stop</button></div>';
      html += '<div class="translation-block" style="margin-top:8px">' + sub.feedbackId + '</div></div>';
    }
    fbArea.innerHTML = html;
    area.appendChild(fbArea);
  }
}
