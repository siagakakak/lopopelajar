<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HOTS Descriptive Text Analysis - Lopo Pelajar</title>
<style>
:root { --primary:#1b365d; --secondary:#0066cc; --accent:#d97706; --danger:#dc2626; --success:#16a34a; --bg:#f8fafc; --card:#fff; --text:#1e293b; --purple:#7c3aed; }
* { box-sizing: border-box; }
body { font-family:'Segoe UI',system-ui,sans-serif; line-height:1.65; color:var(--text); background:var(--bg); margin:0; padding:0; }
.no-copy { -webkit-user-select:none; user-select:none; }
.header-banner { background:linear-gradient(135deg,var(--primary),var(--secondary)); color:#fff; padding:22px 20px; text-align:center; box-shadow:0 4px 12px rgba(0,0,0,.15); }
.header-banner h1 { margin:0; font-size:1.5rem; }
.header-banner h2 { margin:6px 0 0 0; font-size:1rem; font-weight:400; opacity:.9; }
.container { max-width:960px; margin:20px auto; padding:0 15px; }
.container-wide { max-width:100%; margin:0; padding:15px; }
.card { background:var(--card); padding:22px; margin-bottom:18px; border-radius:12px; box-shadow:0 2px 8px rgba(0,0,0,.06); border:1px solid #e2e8f0; }
.login-card { max-width:400px; margin:60px auto; }
.section-title { color:var(--primary); font-size:1.2rem; margin-top:0; padding-bottom:8px; border-bottom:2px solid #e2e8f0; }

.top-nav { display:flex; gap:10px; background:#0f172a; padding:10px 15px; overflow-x:auto; }
.top-nav-btn { background:transparent; color:#94a3b8; border:2px solid transparent; padding:10px 18px; border-radius:8px; cursor:pointer; font-weight:700; white-space:nowrap; font-size:.95rem; transition:all .2s; }
.top-nav-btn.active { background:var(--secondary); color:#fff; border-color:#60a5fa; }
.top-nav-btn:hover { color:#fff; }

.sub-nav { display:flex; gap:8px; padding:12px 15px; overflow-x:auto; background:#f1f5f9; border-bottom:2px solid #cbd5e1; }
.sub-nav-btn { background:#e2e8f0; color:#475569; border:none; padding:9px 16px; border-radius:20px; cursor:pointer; font-weight:600; white-space:nowrap; font-size:.85rem; transition:all .2s; }
.sub-nav-btn.active { background:var(--secondary); color:#fff; box-shadow:0 2px 6px rgba(0,102,204,.4); }
.sub-nav-btn.done { border-left:4px solid var(--success); }

.form-group { margin-bottom:14px; }
label { display:block; font-weight:600; margin-bottom:6px; font-size:.95rem; }
input[type=text],input[type=password],textarea { width:100%; padding:11px; border:1px solid #cbd5e1; border-radius:8px; font-family:inherit; font-size:.95rem; }
textarea { min-height:130px; resize:vertical; }
.password-wrapper { position:relative; }
.password-wrapper input { padding-right:42px; }
.toggle-password { position:absolute; right:12px; top:50%; transform:translateY(-50%); cursor:pointer; font-size:1.1rem; color:#64748b; }
.char-count { text-align:right; color:#64748b; font-size:.85rem; margin-top:4px; }
.char-count.valid { color:var(--success); font-weight:700; }
.btn { display:inline-block; padding:11px 20px; border-radius:8px; border:none; font-weight:700; font-size:.95rem; cursor:pointer; transition:transform .15s; }
.btn:active { transform:scale(.98); }
.btn:disabled { opacity:.5; cursor:not-allowed; }
.btn-primary { background:var(--secondary); color:#fff; width:100%; }
.btn-success { background:var(--success); color:#fff; width:100%; }
.btn-warning { background:var(--accent); color:#fff; width:100%; }
.btn-danger { background:var(--danger); color:#fff; }
.btn-outline { background:#fff; border:2px solid var(--secondary); color:var(--secondary); }

.alert { padding:12px; border-radius:8px; margin-top:12px; display:none; }
.alert-danger { background:#fef2f2; color:#991b1b; border:1px solid #fecaca; }
.alert-success { background:#f0fdf4; color:#15803d; border:1px solid #86efac; }

.pronounce-block { background:#f0f9ff; border-left:4px solid var(--secondary); padding:10px 14px; color:#0369a1; font-style:italic; border-radius:4px; margin-bottom:10px; line-height:1.5; font-size:.92rem; }
.translation-block { background:#f0fdf4; border-left:4px solid var(--success); padding:10px 14px; color:#15803d; border-radius:4px; margin-bottom:14px; line-height:1.5; font-size:.92rem; }
.formatted-paragraph { font-size:1rem; font-weight:500; color:#0f172a; margin-bottom:8px; text-align:justify; }

.audio-controls { display:flex; gap:8px; align-items:center; margin:10px 0; flex-wrap:wrap; }
.btn-audio { border:none; padding:6px 12px; border-radius:16px; cursor:pointer; font-weight:700; font-size:.78rem; color:#fff; }
.btn-play-en { background:var(--secondary); }
.btn-play-id { background:var(--success); }
.btn-stop { background:var(--danger); }
.speed-tag { background:#e2e8f0; padding:3px 8px; border-radius:10px; font-size:.72rem; font-weight:700; }

.question-tabs-container { display:flex; gap:8px; overflow-x:auto; padding-bottom:10px; margin-bottom:12px; border-bottom:2px solid #e2e8f0; }
.q-tab { padding:8px 14px; background:#e2e8f0; color:#334155; border-radius:8px; cursor:pointer; font-weight:600; font-size:.85rem; white-space:nowrap; }
.q-tab.active { background:var(--secondary); color:#fff; }
.q-tab.done { border-left:4px solid var(--success); }
.q-tab.needs-fix { border-left:4px solid var(--danger); animation:pulse 2s infinite; }
@keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:.7;} }

.recorder-box { background:#fff7ed; padding:16px; border-radius:10px; border:2px solid #fdba74; margin-top:14px; }
.btn-record { background:var(--danger); color:#fff; border:none; padding:12px 22px; border-radius:50px; font-size:1rem; font-weight:700; cursor:pointer; display:inline-flex; gap:8px; align-items:center; box-shadow:0 4px 12px rgba(220,38,38,.3); }
.btn-record.recording { background:#991b1b; animation:pulseRec 1s infinite; }
@keyframes pulseRec { 0%,100%{opacity:1;} 50%{opacity:.6;} }
.live-transcript-box { background:#f0f9ff; border-left:4px solid var(--secondary); padding:10px 14px; margin-top:12px; border-radius:4px; min-height:45px; font-size:.9rem; color:#0c4a6e; }
.live-transcript-box .label { font-weight:700; color:var(--secondary); font-size:.8rem; display:block; margin-bottom:4px; }
.recorder-status { font-size:.9rem; margin-top:10px; color:#7c2d12; font-weight:600; text-align:center; }
.recorder-status.recording { color:var(--danger); }
.recorder-status.done { color:var(--success); }
.audio-playback-custom { width:100%; margin-top:12px; display:none; }

.saved-answer-preview { background:#f0fdf4; border:1px solid #86efac; padding:14px; border-radius:10px; margin-bottom:14px; border-left:4px solid var(--success); }
.saved-answer-preview h3 { margin:0 0 8px 0; color:var(--primary); font-size:1rem; }
.descriptive-feedback { background:#fff; border-radius:10px; padding:16px; margin-top:12px; border:2px solid #e2e8f0; }
.teacher-feedback { background:#eff6ff; border:2px solid var(--secondary); border-radius:10px; padding:16px; margin-top:14px; }
.reupload-section { background:#fef2f2; border:2px solid var(--danger); border-radius:10px; padding:16px; margin-top:14px; }
.reupload-required { background:#fee2e2; color:#991b1b; padding:10px; border-radius:8px; margin-bottom:12px; font-weight:700; }

.quiz-question-card { background:#fff; border-radius:12px; padding:20px; margin-bottom:16px; border:2px solid #e2e8f0; }
.quiz-question-card.correct { border-color:var(--success); background:#f0fdf4; }
.quiz-question-card.incorrect { border-color:var(--danger); background:#fef2f2; }
.quiz-q-num { display:inline-block; background:var(--primary); color:#fff; padding:4px 10px; border-radius:12px; font-size:.78rem; font-weight:700; margin-bottom:10px; }
.quiz-q-text { font-size:1rem; font-weight:600; margin-bottom:12px; line-height:1.5; }
.quiz-options { margin:12px 0; }
.quiz-option { display:flex; align-items:flex-start; padding:12px 14px; margin-bottom:8px; border:2px solid #cbd5e1; border-radius:8px; cursor:pointer; transition:all .2s; }
.quiz-option:hover { border-color:var(--secondary); background:#f0f9ff; }
.quiz-option.selected { border-color:var(--secondary); background:#eff6ff; }
.quiz-option.correct { border-color:var(--success); background:#f0fdf4; }
.quiz-option.incorrect { border-color:var(--danger); background:#fef2f2; }
.quiz-option.missed { border-color:var(--accent); background:#fff7ed; border-style:dashed; }
.quiz-option input[type=radio], .quiz-option input[type=checkbox] { margin-right:10px; margin-top:4px; transform:scale(1.2); cursor:pointer; }
.quiz-option-letter { font-weight:700; color:var(--primary); margin-right:8px; min-width:20px; }
.quiz-tf-buttons { display:flex; gap:14px; margin:14px 0; }
.quiz-tf-btn { flex:1; padding:16px; border:2px solid #cbd5e1; border-radius:10px; cursor:pointer; font-size:1.1rem; font-weight:700; background:#fff; transition:all .2s; }
.quiz-tf-btn:hover { border-color:var(--secondary); }
.quiz-tf-btn.selected { background:var(--secondary); color:#fff; border-color:var(--secondary); }
.quiz-tf-btn.correct { background:var(--success); color:#fff; border-color:var(--success); }
.quiz-tf-btn.incorrect { background:var(--danger); color:#fff; border-color:var(--danger); }
.quiz-feedback { margin-top:12px; padding:12px; border-radius:8px; background:#f8fafc; border-left:4px solid var(--secondary); }
.quiz-feedback.correct { border-left-color:var(--success); background:#f0fdf4; }
.quiz-feedback.incorrect { border-left-color:var(--danger); background:#fef2f2; }
.quiz-summary { background:linear-gradient(135deg,var(--primary),var(--secondary)); color:#fff; padding:24px; border-radius:12px; text-align:center; margin-bottom:18px; }
.quiz-summary h2 { margin:0 0 10px 0; font-size:1.5rem; }
.quiz-summary .score-big { font-size:3rem; font-weight:800; }
.quiz-summary .score-sub { font-size:1.1rem; opacity:.9; }

.instr-box { background:#f8fafc; border:1px solid #cbd5e1; border-radius:10px; padding:16px; margin-bottom:14px; max-height:500px; overflow-y:auto; }
.instr-box h3 { margin-top:0; color:var(--primary); }
.instr-box pre { background:#fff; padding:10px; border-radius:6px; white-space:pre-wrap; font-family:inherit; font-size:.9rem; }

.progress-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:14px; }
.progress-tile { background:#fff; border:2px solid #e2e8f0; border-radius:10px; padding:16px; text-align:center; }
.progress-tile .num { font-size:2rem; font-weight:800; color:var(--secondary); }
.progress-tile .lbl { font-size:.85rem; color:#64748b; margin-top:4px; }
.progress-bar-outer { background:#e2e8f0; border-radius:20px; height:12px; overflow:hidden; margin:8px 0; }
.progress-bar-inner { height:100%; background:linear-gradient(90deg,var(--success),var(--secondary)); transition:width .5s; }

.modal-overlay { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,.7); z-index:1000; justify-content:center; align-items:center; }
.modal-overlay.active { display:flex; }
.modal-content { background:#fff; border-radius:14px; padding:24px; max-width:700px; width:92%; max-height:90vh; overflow-y:auto; }
.modal-close { background:var(--danger); color:#fff; border:none; width:34px; height:34px; border-radius:50%; cursor:pointer; font-size:1.1rem; float:right; }
.drive-player iframe { width:100%; height:200px; border:none; border-radius:8px; }

.materi-tab-content { max-height:calc(100vh - 300px); overflow-y:auto; }

.hidden { display:none !important; }

@media (max-width: 700px) {
  .header-banner h1 { font-size:1.2rem; }
  .card { padding:16px; }
  .quiz-tf-buttons { flex-direction:column; }
}
</style>
</head>
<body>

<div class="header-banner">
  <h1>🎓 HOTS Descriptive Text Analysis</h1>
  <h2>Lopo Pelajar — Webapp Pembelajaran 2</h2>
</div>

<div id="login-container" class="container">
  <div class="card login-card">
    <h2 class="section-title">🔐 Masuk Portal Siswa</h2>
    <form onsubmit="doLogin(event)">
      <div class="form-group">
        <label>Nama Lengkap</label>
        <input type="text" id="inNama" required autocomplete="name">
      </div>
      <div class="form-group">
        <label>Password</label>
        <div class="password-wrapper">
          <input type="password" id="inPass" required autocomplete="current-password">
          <span class="toggle-password" onclick="togglePwd()">👁️</span>
        </div>
      </div>
      <button type="submit" class="btn btn-primary" id="btnLogin">Masuk</button>
    </form>
    <div id="loginError" class="alert alert-danger"></div>
  </div>
</div>

<div id="main-app" class="hidden">
  <div class="top-nav" id="topNav"></div>
  <div class="sub-nav" id="subNav"></div>
  <div class="container-wide" id="contentArea">
    <div class="card"><p style="text-align:center;color:#64748b;">Memuat data...</p></div>
  </div>
</div>

<div id="audioModal" class="modal-overlay">
  <div class="modal-content">
    <button class="modal-close" onclick="closeAudioModal()">✕</button>
    <h3 style="margin-top:0;color:var(--primary);">🎧 Rekaman Suara Anda</h3>
    <div class="drive-player"><iframe id="audioFrame" src="" allow="autoplay"></iframe></div>
  </div>
</div>

<script>
// ==========================================
// KONFIGURASI — GANTI DENGAN URL WEB APP ANDA
// ==========================================
const GAS_URL = 'https://script.google.com/macros/s/AKfycbyvxHCeFbPeUvqsvcCmafLPeOXlpuVHRxOOU2kdz6b_FmIqIWtV5Kjsa3zpmafiAZa8Sg/exec';

// ==========================================
// STATE
// ==========================================
let USER = { nama: '', password: '' };
let TEXTS = [];
let CUR_TEXT = '';
let CUR_DATA = null;
let CUR_TAB = 'materi';
let CUR_ANALYSIS = 1;
let curAudioUrl = '';
let voices = [];
let mr = null, chunks = [], recog = null, finalTxt = '', isRec = false, recStart = 0, blobGlobal = null;

// ==========================================
// UTILITY
// ==========================================
function $(id){return document.getElementById(id);}
function el(tag, props){var e=document.createElement(tag);if(props){for(var k in props){if(k==='html')e.innerHTML=props[k];else if(k==='text')e.textContent=props[k];else if(k==='class')e.className=props[k];else if(k.startsWith('on'))e[k.toLowerCase()]=props[k];else e.setAttribute(k,props[k]);}}return e;}
function esc(s){return String(s||'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function escRe(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');}
function togglePwd(){var p=$('inPass');p.type=p.type==='password'?'text':'password';}

async function api(action, payload) {
  try {
    var res = await fetch(GAS_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({action:action, payload:payload}) });
    return await res.json();
  } catch(e) { return { success:false, message:'Koneksi gagal: '+e.message }; }
}

// ==========================================
// VOICES & TTS
// ==========================================
function loadVoices(){voices=window.speechSynthesis.getVoices();}
loadVoices();
if(window.speechSynthesis.onvoiceschanged !== undefined) window.speechSynthesis.onvoiceschanged = loadVoices;

function pickVoice(lang) {
  var isId = lang.startsWith('id');
  var prefs = isId ?
    [v=>v.lang==='id-ID' && /google|natural/i.test(v.name), v=>v.lang==='id-ID', v=>v.lang.startsWith('id')] :
    [v=>v.lang==='en-US' && /google|natural/i.test(v.name), v=>v.lang==='en-US', v=>v.lang.startsWith('en')];
  for (var i = 0; i < prefs.length; i++) {
    var found = voices.find(prefs[i]);
    if (found) return found;
  }
  return null;
}

function playText(text, lang, rate) {
  if (!text) return;
  window.speechSynthesis.cancel();
  var u = new SpeechSynthesisUtterance(text);
  u.rate = rate || (lang.startsWith('id') ? 0.85 : 0.75);
  u.lang = lang;
  var v = pickVoice(lang);
  if (v) u.voice = v;
  window.speechSynthesis.speak(u);
}
function stopTTS(){window.speechSynthesis.cancel();}

// ==========================================
// LOGIN
// ==========================================
async function doLogin(e) {
  e.preventDefault();
  var nama = $('inNama').value.trim(), pass = $('inPass').value.trim();
  if (!nama || !pass) return;
  $('btnLogin').disabled = true;
  $('btnLogin').textContent = '⏳ Memverifikasi...';
  $('loginError').style.display = 'none';
  var r = await api('login', { nama:nama, password:pass });
  $('btnLogin').disabled = false;
  $('btnLogin').textContent = 'Masuk';
  if (!r.success) { $('loginError').textContent = r.message; $('loginError').style.display = 'block'; return; }
  USER.nama = r.nama; USER.password = pass;
  TEXTS = r.availableSheets;
  $('login-container').style.display = 'none';
  $('main-app').classList.remove('hidden');
  buildTopNav();
  if (TEXTS.length > 0) { CUR_TEXT = TEXTS[0]; await loadText(CUR_TEXT); }
}

// ==========================================
// NAV
// ==========================================
function buildTopNav() {
  var nav = $('topNav'); nav.innerHTML = '';
  TEXTS.forEach(function(t, idx) {
    var btn = el('button', { class: 'top-nav-btn' + (idx===0?' active':''), text: t });
    btn.onclick = async function() {
      if (CUR_TEXT === t) return;
      document.querySelectorAll('.top-nav-btn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      CUR_TEXT = t; CUR_TAB = 'materi';
      await loadText(t);
    };
    nav.appendChild(btn);
  });
}

function buildSubNav() {
  var nav = $('subNav'); nav.innerHTML = '';
  var tabs = [
    { id:'materi', label:'📖 Materi' },
    { id:'analysis', label:'🔍 10 Analisis' },
    { id:'pg', label:'📝 Pilihan Ganda (10)' },
    { id:'mcma', label:'✅ MCMA (5)' },
    { id:'tf', label:'✔️ True/False (5)' },
    { id:'progress', label:'📊 Progres' }
  ];
  tabs.forEach(function(t) {
    var btn = el('button', { class:'sub-nav-btn' + (t.id===CUR_TAB?' active':''), text:t.label });
    btn.onclick = function() {
      CUR_TAB = t.id;
      document.querySelectorAll('.sub-nav-btn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      renderTab();
    };
    nav.appendChild(btn);
  });
}

// ==========================================
// LOAD TEXT DATA
// ==========================================
async function loadText(sheetName) {
  $('contentArea').innerHTML = '<div class="card"><p style="text-align:center;">⏳ Memuat data...</p></div>';
  var r = await api('getTextSheetData', { sheetName: sheetName, studentName: USER.nama });
  if (!r.success) {
    $('contentArea').innerHTML = '<div class="card"><div class="alert alert-danger" style="display:block;">' + esc(r.message||'Gagal memuat.') + '</div></div>';
    return;
  }
  CUR_DATA = r;
  buildSubNav();
  renderTab();
}

// ==========================================
// RENDER TAB
// ==========================================
function renderTab() {
  var area = $('contentArea'); area.innerHTML = '';
  if (!CUR_DATA) { area.innerHTML = '<div class="card"><p>Data belum tersedia.</p></div>'; return; }
  if (CUR_TAB === 'materi') renderMateri(area);
  else if (CUR_TAB === 'analysis') renderAnalysis(area);
  else if (CUR_TAB === 'pg') renderPG(area);
  else if (CUR_TAB === 'mcma') renderMCMA(area);
  else if (CUR_TAB === 'tf') renderTF(area);
  else if (CUR_TAB === 'progress') renderProgress(area);
}

// ==========================================
// RENDER MATERI
// ==========================================
function renderMateri(area) {
  var m = CUR_DATA.materi;
  var card = el('div', { class:'card no-copy' });
  card.innerHTML = '<h2 class="section-title">📖 ' + esc(CUR_TEXT) + '</h2>';
  var en = esc(m.materiEn||'').replace(/\n+/g,'<br>');
  var pr = esc(m.materiPronounce||'');
  var id = esc(m.materiId||'').replace(/\n+/g,'<br>');
  var controls1 = el('div', { class:'audio-controls', html:
    '<button class="btn-audio btn-play-en" onclick="playText(CUR_DATA.materi.materiEn, \'en-US\', 0.75)">▶ Play EN</button>' +
    '<button class="btn-audio btn-stop" onclick="stopTTS()">⏹ Stop</button>' +
    '<span class="speed-tag">0.75x</span>'
  });
  card.appendChild(controls1);
  card.appendChild(el('div', { class:'formatted-paragraph', html: en }));
  if (pr) card.appendChild(el('div', { class:'pronounce-block', text: pr }));
  var controls2 = el('div', { class:'audio-controls', html:
    '<button class="btn-audio btn-play-id" onclick="playText(CUR_DATA.materi.materiId, \'id-ID\', 0.85)">▶ Play ID</button>' +
    '<button class="btn-audio btn-stop" onclick="stopTTS()">⏹ Stop</button>' +
    '<span class="speed-tag">0.85x</span>'
  });
  card.appendChild(controls2);
  if (id) card.appendChild(el('div', { class:'translation-block', html: id }));
  area.appendChild(card);
}

// ==========================================
// RENDER ANALYSIS
// ==========================================
function renderAnalysis(area) {
  var wrap = el('div');
  var tabs = el('div', { class:'question-tabs-container' });
  CUR_DATA.analyses.forEach(function(a) {
    var cls = 'q-tab' + (a.num===CUR_ANALYSIS?' active':'') + (a.hasAnswer?' done':'');
    var tab = el('div', { class: cls, text: 'Analisis ' + a.num });
    tab.onclick = function() { CUR_ANALYSIS = a.num; renderTab(); };
    tabs.appendChild(tab);
  });
  wrap.appendChild(tabs);
  var a = CUR_DATA.analyses.find(x=>x.num===CUR_ANALYSIS);
  if (!a) { area.appendChild(el('div',{class:'card',html:'<p>Analisis tidak ditemukan.</p>'})); return; }

  // Instruction
  var instrCard = el('div', { class:'card no-copy' });
  instrCard.innerHTML = '<h2 class="section-title">🔍 Analisis ' + a.num + ': ' + esc(a.name) + '</h2>';
  var enHtml = esc(a.instructionEn||'').replace(/\n+/g,'<br>');
  var idHtml = esc(a.instructionId||'').replace(/\n+/g,'<br>');
  instrCard.innerHTML += '<div class="audio-controls">' +

async function requestTranslate() {
  var text = $('answerInput').value.trim();
  if (text.length < 300) return;
  $('btnTranslate').disabled = true; $('btnTranslate').textContent = '⏳ Menerjemahkan...';
  $('answerError').style.display = 'none';

  if (!r.success) { $('answerError').textContent = r.message; $('answerError').style.display = 'block'; return; }

function buildRecorderHTML(prefix) {
  return '<div class="recorder-box">' +
    '<label style="color:#c2410c;font-weight:700;">🎙️ Rekam Suara Anda</label>' +
    '<p style="font-size:.85rem;color:#7c2d12;margin:6px 0;">Klik MULAI REKAM → baca teks → klik SELESAI. Transkrip otomatis akan muncul.</p>' +
    '<div style="text-align:center;margin:14px 0;">' +
      '<button type="button" class="btn-record" id="btnRec" onclick="toggleRec()">🎙️ MULAI REKAM</button>' +
    '</div>' +
    '<div id="recStatus" class="recorder-status">Siap merekam.</div>' +
    '<div id="liveBox" class="live-transcript-box" style="display:none;">' +
      '<span class="label">📝 TRANSKRIP OTOMATIS:</span>' +
      '<div id="liveText" style="color:#64748b;font-style:italic;">Mulai bicara...</div>' +
    '</div>' +
    '<audio id="playback" controls class="audio-playback-custom"></audio>' +
    '<input type="hidden" id="audioData"><input type="hidden" id="audioMime"><input type="hidden" id="audioDur"><input type="hidden" id="audioTxt">' +
  '</div>';
}

function checkBrowser() {
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { alert('Browser tidak mendukung Web Speech API. Gunakan Chrome/Edge.'); return false; }
  if (!window.MediaRecorder) { alert('Browser tidak mendukung MediaRecorder. Gunakan Chrome/Edge.'); return false; }
  return true;
}

function toggleRec() { if (isRec) stopRec(); else startRec(); }

function startRec() {
  if (!checkBrowser()) return;
  finalTxt = ''; chunks = []; isRec = true; recStart = Date.now();
  $('recStatus').textContent = '🔴 SEDANG MEREKAM... Baca teks dengan lantang!';
  $('recStatus').className = 'recorder-status recording';
  $('btnRec').textContent = '⏹ SELESAI REKAM';
  $('btnRec').classList.add('recording');
  $('liveBox').style.display = 'block';
  $('liveText').textContent = 'Mulai bicara...';
  $('liveText').style.color = '#64748b';

  navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream) {
    mr = new MediaRecorder(stream);
    mr.ondataavailable = function(e) { if (e.data && e.data.size > 0) chunks.push(e.data); };
    mr.onstop = function() {
      var mime = mr.mimeType || 'audio/webm';
      blobGlobal = new Blob(chunks, {type:mime});
      var url = URL.createObjectURL(blobGlobal);
      $('playback').src = url; $('playback').style.display = 'block';
      stream.getTracks().forEach(t=>t.stop());
      var fr = new FileReader();
      fr.onload = function(e) {
        $('audioData').value = e.target.result.split(',')[1];
        $('audioMime').value = mime;
        $('audioDur').value = Math.max(1, Math.round((Date.now()-recStart)/1000));
        $('audioTxt').value = (finalTxt||'').trim();
        $('btnSubmitFinal').disabled = !$('audioData').value;
      };
      fr.readAsDataURL(blobGlobal);
    };
    mr.start();
    var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    recog = new SR();
    recog.lang = 'en-US'; recog.continuous = true; recog.interimResults = true;
    recog.onresult = function(ev) {
      var itm = '';
      for (var i = ev.resultIndex; i < ev.results.length; i++) {
        var tp = ev.results[i][0].transcript;
        if (ev.results[i].isFinal) finalTxt += ' ' + tp; else itm += tp;
      }
      var disp = (finalTxt + ' ' + itm).trim();
      if (disp) { $('liveText').textContent = disp; $('liveText').style.color = '#0c4a6e'; $('liveText').style.fontStyle = 'normal'; }
    };
    recog.onerror = function(e){console.warn(e.error);};
    recog.onend = function(){ if (isRec) try{recog.start();}catch(e){} };
    try{recog.start();}catch(e){}
  }).catch(function(err) {
    alert('Tidak bisa akses mikrofon: ' + err.message);
    isRec = false;
    $('btnRec').textContent = '🎙️ MULAI REKAM';
    $('btnRec').classList.remove('recording');
    $('recStatus').textContent = 'Gagal akses mikrofon.';
  });
}

function stopRec() {
  if (!isRec) return;
  isRec = false;
  if (mr && mr.state !== 'inactive') mr.stop();
  if (recog) try{recog.stop();}catch(e){}
  $('recStatus').textContent = '✅ Rekaman selesai. Putar ulang di bawah, lalu klik Kirim.';
  $('recStatus').className = 'recorder-status done';
  $('btnRec').textContent = '🎙️ REKAM ULANG';
  $('btnRec').classList.remove('recording');
  $('audioTxt').value = (finalTxt||'').trim();
}

async function submitFinal(isReupload) {
  var btnId = isReupload ? 'btnSubmitReupload' : 'btnSubmitFinal';
  var btn = $(btnId);
  var audioData = $('audioData').value;
  var duration = $('audioDur').value;
  var txt = $('audioTxt').value;
  if (!audioData) { alert('Rekam suara dulu!'); return; }
  btn.disabled = true; btn.textContent = '⏳ Mengunggah...';
  var fileName = USER.nama + '_A' + CUR_ANALYSIS + (isReupload?'_REUP_':'_') + Date.now() + '.webm';
  var mime = $('audioMime').value || 'audio/webm';
  var up = await api('uploadAudioToDrive', { base64Data: audioData, fileName: fileName, mimeType: mime });
  if (!up.success) { btn.disabled = false; btn.textContent = isReupload?'🔄 Kirim Ulang':'✅ Kirim Jawaban'; alert('Gagal upload: ' + up.message); return; }
  var r = await api('submitAnalysisAnswer', {
    sheetName: CUR_TEXT, studentName: USER.nama, analysisNum: CUR_ANALYSIS,
    jawabanText: window._currentAnswerText || '', audioUrl: up.url, recordingDuration: duration,
    originalEnglishText: window._currentAnswerEn || '', isReupload: isReupload,
    fileSizeBytes: up.sizeBytes, speechTranscript: txt
  });
  btn.disabled = false; btn.textContent = isReupload?'🔄 Kirim Ulang':'✅ Kirim Jawaban';
  if (r.success) {
    alert(r.requiresReupload ? '⚠️ PERHATIAN: ' + r.rerecordMessage : '✅ Jawaban berhasil terkirim!');
    await loadText(CUR_TEXT);
  } else {
    alert('Gagal: ' + r.message);
  }
}

  target.style.display = 'block';
  target.innerHTML = '<h3 style="color:var(--danger);">🔄 Form Rekam Ulang</h3>' +
    buildRecorderHTML('reup') +
    '<button class="btn btn-warning" id="btnSubmitReupload" onclick="submitFinal(true)" disabled style="margin-top:12px;">🔄 Kirim Rekam Ulang</button>';

}

function parseOptions(soalEn) {
  var text = (soalEn||'').replace(/<br\s*\/?>/gi,'\n');
  var lines = text.split('\n').map(l=>l.trim()).filter(l=>l);
  var qLines = [], opts = [], cur = null;
  for (var i = 0; i < lines.length; i++) {
    var line = lines[i];
    if (/^Options:\s*$/i.test(line)) continue;
    var m = line.match(/^([A-E])[\.\)]\s+(.+)$/i);
    if (m) {
      if (cur) opts.push(cur);
      cur = { letter: m[1].toUpperCase(), text: m[2] };
    } else if (cur) {
      cur.text += ' ' + line;
    } else {
      qLines.push(line);
    }
  }
  if (cur) opts.push(cur);
  return opts;
}

function setPGAnswer(num, letter) {
  var q = CUR_DATA.pg.find(x=>x.num===num);
  if (q && !q.studentAnswer) q.studentAnswer = letter;
  document.querySelectorAll('#pg-q-' + num + ' .quiz-option').forEach(function(el){
    el.classList.toggle('selected', el.getAttribute('data-letter')===letter);
  });
}

function toggleMCMA(num, letter, checked) {
  var q = CUR_DATA.mcma.find(x=>x.num===num);

  else if (!checked && idx !== -1) q._temp.splice(idx, 1);
}

  var container = el('div');
  CUR_DATA.tf.forEach(function(q) {
    var qc = el('div', { class:'quiz-question-card' + (q.isCorrect===true?' correct':q.isCorrect===false?' incorrect':''), id:'tf-q-'+q.num });
    qc.innerHTML = '<span class="quiz-q-num">Statement ' + q.num + ' dari 5</span>' +
      '<div class="quiz-q-text">' + esc(q.statementEn) + '</div>' +
      (q.statementPronounce?'<div class="pronounce-block" style="font-size:.82rem;">' + esc(q.statementPronounce) + '</div>':'') +
      (q.statementId?'<div class="translation-block" style="font-size:.85rem;">' + esc(q.statementId) + '</div>':'') +
      '<div class="audio-controls"><button class="btn-audio btn-play-en" onclick="playText(CUR_DATA.tf.find(x=>x.num===' + q.num + ').statementEn, \'en-US\', 0.75)">▶ Play EN</button></div>';

    var tbtns = el('div', { class:'quiz-tf-buttons' });
    var tBtn = el('button', { type:'button', class:'quiz-tf-btn' + (q.studentAnswer==='True'?' selected':''), text:'✓ TRUE' });
    var fBtn = el('button', { type:'button', class:'quiz-tf-btn' + (q.studentAnswer==='False'?' selected':''), text:'✗ FALSE' });
    if (q.studentAnswer) {
      tBtn.disabled = fBtn.disabled = true;
      if (q.correctAnswer === 'True') { tBtn.classList.add('correct'); if(q.studentAnswer==='False') fBtn.classList.add('incorrect'); }
      else { fBtn.classList.add('correct'); if(q.studentAnswer==='True') tBtn.classList.add('incorrect'); }
    } else {
      tBtn.onclick = function() { q.studentAnswer = 'True'; renderTab(); };
      fBtn.onclick = function() { q.studentAnswer = 'False'; renderTab(); };
    }
    tbtns.appendChild(tBtn); tbtns.appendChild(fBtn);
    qc.appendChild(tbtns);

    if (q.studentAnswer) {
      var fb = el('div', { class:'quiz-feedback ' + (q.isCorrect?'correct':'incorrect'), html:
        (q.isCorrect ? '✅ <b>Benar!</b> ' : '❌ <b>Kurang tepat.</b> ') +
        'Jawaban benar: <b>' + esc(q.correctAnswer) + '</b><br><br>' +
        '<div style="font-size:.9rem;line-height:1.6;">' + esc(q.feedbackEn).replace(/\n/g,'<br>') + '</div>' +
        '<div class="audio-controls" style="margin-top:8px;"><button class="btn-audio btn-play-en" onclick="playText(' + JSON.stringify(q.feedbackEn) + ', \'en-US\', 0.75)">▶ Play Feedback</button></div>'
      });
      qc.appendChild(fb);
    }
    container.appendChild(qc);
  });
  card.appendChild(container);
  if (!CUR_DATA.tf.every(x=>x.studentAnswer)) {
    card.appendChild(el('button', { class:'btn btn-success', text:'📤 Kirim Jawaban True/False', onclick:'submitQuiz(\'TF\')' }));
  } else {
    card.appendChild(el('button', { class:'btn btn-outline', text:'🔄 Ulangi True/False', onclick:'redoQuiz(\'TF\')' }));
  }
  area.appendChild(card);
}

async function submitQuiz(type) {
  var answers = [];
  if (type === 'PG') {
    var unanswered = CUR_DATA.pg.filter(x=>!x.studentAnswer);
    if (unanswered.length) { alert('Masih ada ' + unanswered.length + ' soal PG yang belum dijawab!'); return; }
    CUR_DATA.pg.forEach(function(q){ answers.push({type:'PG', num:q.num, answer:q.studentAnswer}); });
  } else if (type === 'MCMA') {
    CUR_DATA.mcma.forEach(function(q) {
      if (!q._temp || q._temp.length === 0) { alert('Soal MCMA ' + q.num + ' belum dijawab!'); return; }
      answers.push({type:'MCMA', num:q.num, answer:q._temp.sort().join(',')});
    });
    if (answers.length !== CUR_DATA.mcma.length) return;
  } else if (type === 'TF') {
    var un = CUR_DATA.tf.filter(x=>!x.studentAnswer);
    if (un.length) { alert('Masih ada ' + un.length + ' soal TF yang belum dijawab!'); return; }
    CUR_DATA.tf.forEach(function(q){ answers.push({type:'TF', num:q.num, answer:q.studentAnswer}); });
  }
  if (!confirm('Kirim semua jawaban? Setelah dikirim, tidak bisa diubah kecuali klik "Ulangi Quiz".')) return;
  var r = await api('submitQuizAnswers', { sheetName: CUR_TEXT, studentName: USER.nama, answers: answers });
  if (!r.success) { alert('Gagal: ' + r.message); return; }
  alert('✅ Quiz selesai! Skor: ' + r.summary.correct + '/' + r.summary.total + ' (' + r.summary.percentage + '%)');
  await loadText(CUR_TEXT);
}

async function redoQuiz(type) {
  if (!confirm('Yakin ingin mengulang quiz? Jawaban lama akan tetap tersimpan di log.')) return;
  // Clear in-memory + submit empty as new attempt (log schema allows multiple attempts; frontend keeps latest)
  // Simpler: just clear in-memory state and re-render (student answers a fresh one, gets new log entry)
  if (type === 'PG') CUR_DATA.pg.forEach(function(q){ q.studentAnswer = null; q.isCorrect = null; });
  else if (type === 'MCMA') CUR_DATA.mcma.forEach(function(q){ q.studentAnswers = null; q._temp = []; q.isCorrect = null; });
  else if (type === 'TF') CUR_DATA.tf.forEach(function(q){ q.studentAnswer = null; q.isCorrect = null; });
  renderTab();
}

// ==========================================
// PROGRESS DASHBOARD
// ==========================================
function renderProgress(area) {
  var card = el('div', { class:'card' });
  var totAnalyses = CUR_DATA.analyses.filter(a=>a.hasAnswer).length;
  var totPG = CUR_DATA.pg.filter(q=>q.studentAnswer).length;
  var totMCMA = CUR_DATA.mcma.filter(q=>q.studentAnswers).length;
  var totTF = CUR_DATA.tf.filter(q=>q.studentAnswer).length;
  var correctPG = CUR_DATA.pg.filter(q=>q.isCorrect===true).length;
  var correctMCMA = CUR_DATA.mcma.filter(q=>q.isCorrect===true).length;
  var correctTF = CUR_DATA.tf.filter(q=>q.isCorrect===true).length;
  var totalQuiz = CUR_DATA.pg.length + CUR_DATA.mcma.length + CUR_DATA.tf.length;
  var totalCorrect = correctPG + correctMCMA + correctTF;
  var quizPct = totalQuiz > 0 ? Math.round(totalCorrect / totalQuiz * 100) : 0;

  card.innerHTML = '<h2 class="section-title">📊 Progres Belajar Anda — ' + esc(CUR_TEXT) + '</h2>' +
    '<div class="progress-grid">' +
      '<div class="progress-tile"><div class="num">' + totAnalyses + '/10</div><div class="lbl">🔍 Analisis Selesai</div></div>' +
      '<div class="progress-tile"><div class="num">' + totPG + '/' + CUR_DATA.pg.length + '</div><div class="lbl">📝 PG Terjawab</div></div>' +
      '<div class="progress-tile"><div class="num">' + totMCMA + '/' + CUR_DATA.mcma.length + '</div><div class="lbl">✅ MCMA Terjawab</div></div>' +
      '<div class="progress-tile"><div class="num">' + totTF + '/' + CUR_DATA.tf.length + '</div><div class="lbl">✔️ T/F Terjawab</div></div>' +
      '<div class="progress-tile"><div class="num">' + totalCorrect + '/' + totalQuiz + '</div><div class="lbl">🎯 Quiz Benar</div></div>' +
      '<div class="progress-tile"><div class="num">' + quizPct + '%</div><div class="lbl">📈 Skor Quiz</div></div>' +
    '</div>';
  area.appendChild(card);
}

// ==========================================
// AUDIO MODAL
// ==========================================
function openAudioModal(url) {
  var m = $('audioModal'); var iframe = $('audioFrame');
  var id = '';
  var match = url.match(/\/d\/([a-zA-Z0-9_-]+)/);
  if (match) id = match[1];
  else { match = url.match(/id=([a-zA-Z0-9_-]+)/); if (match) id = match[1]; }
  if (id) { iframe.src = 'https://drive.google.com/file/d/' + id + '/preview'; m.classList.add('active'); }
}
function closeAudioModal() { $('audioModal').classList.remove('active'); $('audioFrame').src = ''; }
document.addEventListener('keydown', function(e){ if(e.key==='Escape') closeAudioModal(); });
</script>
