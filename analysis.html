<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analisis Descriptive Text - Lopo Pelajar</title>
  <style>
    :root { --primary: #1b365d; --secondary: #0066cc; --accent: #d97706; --danger: #dc2626; --success: #16a34a; --bg: #f8fafc; --card-bg: #ffffff; --text: #1e293b; }
    body { font-family: 'Segoe UI', System-UI, sans-serif; line-height: 1.7; color: var(--text); background-color: var(--bg); margin: 0; padding: 0; }
    .header-banner { background-color: var(--primary); color: white; padding: 20px; text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    .nav-bar { display: flex; background: #0f172a; overflow-x: auto; padding: 0 10px; }
    .nav-tab { padding: 14px 20px; color: #94a3b8; text-decoration: none; cursor: pointer; font-weight: 600; white-space: nowrap; border-bottom: 3px solid transparent; transition: 0.2s; }
    .nav-tab.active { color: #ffffff; border-bottom-color: var(--secondary); background: rgba(255,255,255,0.05); }
    .container { max-width: 1200px; margin: 20px auto; padding: 0 20px; box-sizing: border-box; }
    .card { background: var(--card-bg); padding: 25px; margin-bottom: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); border: 1px solid #e2e8f0; }
    .login-card { max-width: 400px; margin: 60px auto; }
    .section-title { color: var(--primary); font-size: 1.3rem; margin-top: 0; border-bottom: 2px solid #e2e8f0; padding-bottom: 8px; }
    
    .two-column-layout { display: grid; grid-template-columns: 1fr 1.2fr; gap: 20px; align-items: start; }
    @media (max-width: 900px) { .two-column-layout { grid-template-columns: 1fr; } }
    
    .formatted-paragraph { font-size: 1.05rem; font-weight: 500; color: #0f172a; margin-bottom: 12px; text-align: justify; white-space: pre-wrap; }
    .pronounce-block { background-color: #f0f9ff; border-left: 4px solid var(--secondary); padding: 12px 16px; color: #0369a1; font-style: italic; border-radius: 4px; margin-bottom: 12px; line-height: 1.6; }
    .translation-block { background-color: #f0fdf4; border-left: 4px solid var(--success); padding: 12px 16px; color: #15803d; border-radius: 4px; margin-bottom: 20px; line-height: 1.6; white-space: pre-wrap; }
    
    .form-group { margin-bottom: 15px; }
    label { display: block; font-weight: 600; margin-bottom: 6px; }
    input[type="text"], input[type="password"], select, textarea { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; box-sizing: border-box; font-family: inherit; }
    .password-wrapper { position: relative; display: flex; align-items: center; }
    .password-wrapper input { padding-right: 45px; }
    .toggle-password { position: absolute; right: 12px; cursor: pointer; font-size: 1.2rem; color: #64748b; }
    
    .btn-submit { background-color: var(--success); color: white; border: none; padding: 12px 20px; border-radius: 8px; width: 100%; font-size: 1rem; font-weight: bold; cursor: pointer; margin-top: 10px; }
    .btn-submit:disabled { background-color: #cbd5e1; cursor: not-allowed; }
    .alert { padding: 12px; border-radius: 8px; margin-top: 15px; display: none; }
    .alert-danger { background-color: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }

    /* Accordion untuk Bagian Kanan */
    .accordion-item { border: 1px solid #e2e8f0; border-radius: 8px; margin-bottom: 15px; overflow: hidden; }
    .accordion-header { background: #f1f5f9; padding: 15px 20px; cursor: pointer; font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
    .accordion-header.active { background: var(--secondary); color: white; }
    .accordion-content { display: none; padding: 20px; background: white; border-top: 1px solid #e2e8f0; }
    .accordion-content.show { display: block; }
    .status-badge { font-size: 0.8rem; padding: 4px 8px; border-radius: 12px; background: #e2e8f0; color: #64748b; }
    .status-badge.done { background: #dcfce7; color: #166534; }

    .recorder-box { background: #fff7ed; padding: 20px; border-radius: 8px; border: 1px solid #fdba74; margin-top: 15px; }
    .btn-record { background: var(--danger); color: white; border: none; padding: 12px 24px; border-radius: 50px; font-size: 1rem; font-weight: bold; cursor: pointer; display: inline-flex; align-items: center; gap: 10px; }
    .btn-record.recording { background: #991b1b; animation: pulseRec 1s infinite; }
    @keyframes pulseRec { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
    .live-transcript-box { background: #f0f9ff; border-left: 4px solid var(--secondary); padding: 12px 16px; margin-top: 15px; border-radius: 4px; min-height: 50px; font-size: 0.95rem; color: #0c4a6e; line-height: 1.6; display: none; }
    .recorder-status { font-size: 0.9rem; margin-top: 10px; color: #7c2d12; font-weight: 600; text-align: center; }
    .recorder-status.recording { color: var(--danger); }
    
    .feedback-display { background: #f0fdf4; border: 1px solid #86efac; padding: 15px; border-radius: 8px; margin-top: 15px; border-left: 4px solid var(--success); }
    .feedback-display p { margin: 8px 0; white-space: pre-wrap; }
  else { counter.className = 'char-count'; btn.disabled = true; }
  }

  async function prepareRecording(secId) {
    const text = document.getElementById(`ans_${secId}`).value;
    if (text.length < 30) { alert('Jawaban minimal 30 karakter!'); return; }
    
    const btn = document.getElementById(`btn_trans_${secId}`);
    btn.disabled = true; btn.innerText = 'Menerjemahkan...';
    
    const res = await callGas('getInstantTranslation', { text });
    btn.disabled = false; btn.innerText = 'Terjemahkan & Rekam';
    
    if (res.success) {
      document.getElementById(`en_text_${secId}`).innerText = res.jawabanEn;
      document.getElementById(`rec_area_${secId}`).style.display = 'block';
      document.getElementById(`rec_area_${secId}`).scrollIntoView({ behavior: 'smooth' });
    }
  }

  function toggleRecording(secId) {
    if (isRecording) { stopRecording(); } else { startRecording(secId); }
  }

  function startRecording(secId) {
    activeRecordingId = secId;
    finalTranscript = ''; audioChunks = []; isRecording = true;
    
    const btn = document.getElementById(`btn_rec_${secId}`);
    const status = document.getElementById(`rec_status_${secId}`);
    const transBox = document.getElementById(`trans_box_${secId}`);
    const liveTrans = document.getElementById(`live_trans_${secId}`);

    btn.innerText = '⏹ SELESAI REKAM';
    btn.classList.add('recording');
    status.innerText = '🔴 SEDANG MEREKAM... Bacalah teks di atas!';
    status.classList.add('recording');
    transBox.style.display = 'block';

    navigator.mediaDevices.getUserMedia({ audio: true }).then(function(stream) {
      mediaRecorder = new MediaRecorder(stream);
      mediaRecorder.ondataavailable = function(e) { if (e.data && e.data.size > 0) audioChunks.push(e.data); };
      mediaRecorder.onstop = function() {
        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
        const url = URL.createObjectURL(audioBlob);
        const playback = document.getElementById(`audio_play_${secId}`);
        playback.src = url; playback.style.display = 'block';
        stream.getTracks().forEach(t => t.stop());
        
        const reader = new FileReader();
        reader.onload = function(e) {
          playback.dataset.base64 = e.target.result.split(',')[1];
          document.getElementById(`btn_sub_${secId}`).disabled = false;
        };
        reader.readAsDataURL(audioBlob);
      };
      mediaRecorder.start();

      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (SpeechRecognition) {
        recognition = new SpeechRecognition();
        recognition.lang = 'en-US'; recognition.continuous = true; recognition.interimResults = true;
        recognition.onresult = function(event) {
          let interim = '';
          for (let i = event.resultIndex; i < event.results.length; i++) {
            const part = event.results[i][0].transcript;
            if (event.results[i].isFinal) finalTranscript += ' ' + part;
            else interim += part;
          }
          const displayText = (finalTranscript + ' ' + interim).trim();
          if (displayText) {
            liveTrans.innerText = displayText;
            liveTrans.style.color = '#0c4a6e'; liveTrans.style.fontStyle = 'normal';
          }
        };
        recognition.onend = function() { if (isRecording) { try { recognition.start(); } catch (e) {} } };
        try { recognition.start(); } catch (e) { console.warn(e); }
      }
    }).catch(function(err) {
      alert('Tidak bisa mengakses mikrofon: ' + err.message);
      isRecording = false;
      btn.innerText = '🎙️ MULAI REKAM'; btn.classList.remove('recording');
      status.innerText = 'Gagal mengakses mikrofon.'; status.classList.remove('recording');
    });
  }

  function stopRecording() {
    if (!isRecording) return;
    isRecording = false;
    if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
    if (recognition) { try { recognition.stop(); } catch (e) {} }

    const secId = activeRecordingId;
    const btn = document.getElementById(`btn_rec_${secId}`);
    const status = document.getElementById(`rec_status_${secId}`);
    
    btn.innerText = '🎙️ REKAM ULANG'; btn.classList.remove('recording');
    status.innerText = '✅ Rekaman selesai. Silakan kirim.'; status.classList.remove('recording');
  }

  async function submitAnalysis(secId) {
    const btn = document.getElementById(`btn_sub_${secId}`);
    btn.disabled = true; btn.innerText = 'Mengunggah & Menyimpan...';

    const playback = document.getElementById(`audio_play_${secId}`);
    const base64 = playback.dataset.base64;
    const transcript = finalTranscript.trim();
    const indonesianText = document.getElementById(`ans_${secId}`).value;
    
    const sec = currentSheetData.analysisSections.find(s => s.id === secId);

    const audioRes = await callGas('uploadAudioToDrive', { 
      base64Data: base64, 
      fileName: `${activeUser.nama}_${sec.title.replace(/\s+/g, '_')}_${Date.now()}.webm`, 
      mimeType: 'audio/webm' 
    });
    
    if (!audioRes.success) { alert('Gagal upload audio'); btn.disabled = false; btn.innerText = '✅ Kirim Jawaban & Penilaian'; return; }

    // Simulasi skor (bisa diganti dengan logika AI Anda)
    const mockScore = Math.floor(Math.random() * (100 - 75) + 75); 

    const payload = {
      sheetName: currentSheet, studentName: activeUser.nama,
      colMap: sec.cols,
      jawabId: indonesianText,
      jawabEn: document.getElementById(`en_text_${secId}`).innerText,
      audioUrl: audioRes.downloadUrl,
      transkrip: transcript,
      akurasi: mockScore,
      penilaian: 'Analisis baik. Terus tingkatkan pengucapan.',
      feedbackEn: 'Good job! Keep practicing your pronunciation.',
      feedbackId: 'Kerja bagus! Terus latih pengucapan Anda.'
    };

    const res = await callGas('submitAnalysis', payload);
    if (res.success) { 
      alert('✅ Jawaban berhasil dikirim dan disimpan di Sheet!'); 
      loadSheetContent(currentSheet); 
    } else { 
      alert('Gagal: ' + res.message); 
      btn.disabled = false; btn.innerText = '✅ Kirim Jawaban & Penilaian'; 
    }
  }
</script>
</body>
</html>
